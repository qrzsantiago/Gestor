<script>
'use strict';
/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = s => document.querySelector(s);
const LS = 'gestor.data.v1', LSUI = 'gestor.ui.v2', APP_VERSION = '2.2';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const r2 = n => Math.round(((+n || 0) + Number.EPSILON) * 100) / 100;
const MXN = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NUM2 = new Intl.NumberFormat('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = n => MXN.format(r2(n));

const fmtInt = n => new Intl.NumberFormat('es-MX').format(n || 0);
const num = v => {
  if (typeof v === 'number') return v;

};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const pd = s => { if (!s) return null; const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const T0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtD = s => { const d = pd(s); return d ? `${d.getDate()} ${MESC[d.getMonth()]} ${d.getFullYear()}` : '—'; };

/* =========================================================

   ========================================================= */
const COLLS = ['accounts','products','clients','sales','credits','payments','expenses','segments','cards','debts'];
function blank() {
  return { version: 2, accounts: [], products: [], clients: [], sales: [], credits: [], payments: [], expenses: [], segments: [], cards: [], debts: [], settings: { lowStock: '', defaultAccount: '', lastBackup: '', demoChecked: true } };
}
function normalize(d) {
  const b = blank();
  COLLS.forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });

  // Migración desde versión anterior
  d.products.forEach(p => { delete p.cost; delete p.price; });
  d.sales.forEach(s => { delete s.unitCost; delete s.unitPrice; });
  d.credits.forEach(c => {
    if (!Array.isArray(c.rateLog) || !c.rateLog.length) c.rateLog = [{ date: c.date || today(), rate: +c.rate || 0 }];
    delete c.rate; delete c.mode; delete c.months; delete c.dueDate;
    if (c.cutDay !== null && c.cutDay !== undefined) c.cutDay = validDay(c.cutDay);

    if (c.periodBase === undefined) { c.periodBase = +c.base || 0; c.nextBase = 0; c.nextDate = ''; c.other = 0; delete c.base; }
  });

  const cats = Array.isArray(d.categories) ? d.categories : [];
  d.expenses.forEach(e => {
    if (!Array.isArray(e.segmentIds)) {
      let ids = [];
      if (e.categoryId) ids = [e.categoryId];
      else if ((e.category || '').trim()) {
        const name = e.category.trim();
        let c = cats.find(x => x.name.toLowerCase() === name.toLowerCase());
        if (!c) { c = { id: uid(), name }; cats.push(c); }
        ids = [c.id];
      }
      e.segmentIds = ids;
    }
    delete e.categoryId; delete e.category;
    if (e.type !== 'ingreso') e.type = 'gasto';

}
/* Elimina únicamente los registros de ejemplo que creaba la versión 1 (coincidencia exacta)

let legacyRemoved = 0;
function cleanLegacyDemo(d) {
  if (d.settings.demoChecked) return;
  d.settings.demoChecked = true;
  let n = 0;
  const rm = (k, pred) => { const b = d[k].length; d[k] = d[k].filter(x => !pred(x)); n += b - d[k].length; };
  const DEMO_PROD = { 'iPhone 13 128GB': 4, 'AirPods Pro 2': 6, 'Funda MagSafe': 25, 'Cargador 20W': 3 };
  const DEMO_CLI = { 'Juan Pérez': '55 1234 5678', 'María López': '55 8765 4321' };
  const DEMO_EXP = [['Metro y camión', 45], ['Comida corrida', 120], ['Bolsas y empaques', 260], ['Café', 55], ['Uber', 98], ['Spotify', 129]];
  const cardIds = new Set(d.cards.filter(c => (c.name === 'Nu' && c.color === 'violet' && +c.limit === 25000 && +c.msi === 3200) || (c.name === 'Openbank' && c.color === 'rose' && +c.limit === 40000)).map(c => c.id));
  const prodIds = new Set(d.products.filter(p => DEMO_PROD[p.name] !== undefined && +p.base === DEMO_PROD[p.name]).map(p => p.id));
  const cliIds = new Set(d.clients.filter(c => DEMO_CLI[c.name] !== undefined && DEMO_CLI[c.name] === c.phone).map(c => c.id));
  const credIds = new Set(d.credits.filter(c => cliIds.has(c.clientId)).map(c => c.id));
  const saleIds = new Set(d.sales.filter(s => prodIds.has(s.productId) || d.credits.some(c => credIds.has(c.id) && c.saleId === s.id)).map(s => s.id));
  rm('payments', p => credIds.has(p.targetId) || cardIds.has(p.targetId));
  rm('credits', c => credIds.has(c.id) || saleIds.has(c.saleId));
  rm('sales', s => saleIds.has(s.id));
  rm('expenses', e => cardIds.has(e.cardId) || DEMO_EXP.some(([t, a]) => e.concept === t && +e.amount === a));
  rm('cards', c => cardIds.has(c.id));
  rm('products', p => prodIds.has(p.id));
  rm('clients', c => cliIds.has(c.id) && !d.sales.some(s => s.clientId === c.id) && !d.credits.some(x => x.clientId === c.id));
  rm('debts', x => x.creditor === 'Proveedor CDMX' && +x.amount === 6000 && x.concept === 'Mercancía a crédito');
  rm('segments', c => ['Pasajes', 'Comida', 'Insumos', 'Servicios'].includes(c.name) && !d.expenses.some(e => (e.segmentIds || []).includes(c.id)));
  const used = id => ['sales', 'payments', 'expenses', 'credits', 'debts'].some(k => d[k].some(r => r.accountId === id));
  rm('accounts', a => (a.name === 'BBVA Débito' && a.type === 'debito' && +a.base === 12000 && !used(a.id)) || (a.name === 'Efectivo' && a.type === 'efectivo' && [0, 2500].includes(+a.base || 0) && !used(a.id)));
  if (d.settings.defaultAccount && !d.accounts.some(a => a.id === d.settings.defaultAccount)) d.settings.defaultAccount = '';

}
function load() { try { const d = JSON.parse(localStorage.getItem(LS)); if (d && typeof d === 'object') return normalize(d); } catch (e) {} return blank(); }
let S = load();
let UI = Object.assign({ view: 'dashboard', credF: 'activos', movF: 'todos', movLimit: 60,
  segF: '', dashP: 'semana', dashO: 0, salesP: 'historico', salesO: 0, expP: 'semana', expO: 0 }, (() => { try { return JSON.parse(localStorage.getItem(LSUI)) || {}; } catch (e) { return {}; } })());
UI.movLimit = 60;
function persist() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar (almacenamiento lleno)', 'error'); } }
function saveUI() { try { localStorage.setItem(LSUI, JSON.stringify(UI)); } catch (e) {} }

const accName = id => byId(S.accounts, id)?.name || '';
const cliName = id => byId(S.clients, id)?.name || '';
const isInc = e => e.type === 'ingreso';
const segNames = ids => (ids || []).map(id => byId(S.segments, id)?.name).filter(Boolean);
const signed = n => (n > 0.005 ? '+' : n < -0.005 ? '−' : '') + fmt(Math.abs(n));
const defaultAcc = () => byId(S.accounts, S.settings.defaultAccount) ? S.settings.defaultAccount : '';
const lowStock = () => Math.max(0, parseInt(S.settings.lowStock) || 0);

/* =========================================================
   CÁLCULOS DERIVADOS
   ========================================================= */
const soldQty = pid => sum(S.sales.filter(s => s.productId === pid), s => s.qty);
const stock = p => (+p.base || 0) - soldQty(p.id);
const paysFor = (kind, id) => S.payments.filter(p => p.kind === kind && p.targetId === id).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
const STATUS_TONE = { Pendiente: 'warn', Abonado: 'info', Pagado: 'ok' };

/* Créditos: sin plazos fijos. Interés sobre saldo insoluto en cada fecha de corte. */
const rateLogSorted = c => [...(c.rateLog || [])].sort((a, b) => (a.date || '').localeCompare(b.date || ''));

function creditConcept(c) { if (c.saleId) { const s = byId(S.sales, c.saleId); if (s) return `${s.productName}${s.qty > 1 ? ' ×' + s.qty : ''}`; } return c.concept || ''; }
function creditInfo(c) {

  const start = pd(c.date) || T0(), T = T0(), cutDay = validDay(c.cutDay);
  let interest = 0; const ev = [];

    let d = firstCutAfter(start, cutDay), g = 0;

      const bal = r2(P + interest - paidB), rate = rateAt(c, d) / 100;

function debtInfo(d) {
  const pays = paysFor('debt', d.id); const paid = r2(sum(pays, p => p.amount));

  const dd = d.dueDate ? daysBetween(T0(), pd(d.dueDate)) : null;

/* Tarjetas: el pago del período es independiente de MSI y saldos diferidos.

  const exps = S.expenses.filter(e => e.cardId === c.id && !isInc(e));
  const charges = [...exps.map(e => ({ date: e.date, amount: +e.amount || 0 })), ...((+c.nextBase || 0) ? [{ date: c.nextDate || '0000-00-00', amount: +c.nextBase }] : [])];
  const closed = sum(charges.filter(x => x.date <= lastCut), x => x.amount), open = sum(charges.filter(x => x.date > lastCut), x => x.amount);
  const pay = sum(paysFor('card', c.id), p => p.amount);

function accFlows(a) {

    <div class="flex items-center gap-2 text-[13px] font-medium text-zinc-300 mb-3">${icon('percent', 'w-4 h-4 text-zinc-500')}Interés sobre saldo insoluto</div>
    <div class="grid grid-cols-2 gap-x-3">
      ${fld('Interés % por corte', inp('rate', c ? (curRate(c) || '') : '', 'inputmode="decimal"'))}
      ${fld('Día de corte', inp('cutDay', c?.cutDay || '', 'inputmode="numeric" pattern="[0-9]*"'))}
    </div>
    <div id="rateFromBox" class="hidden">${fld('Aplicar la nueva tasa', seg('rateFrom', [['hoy', 'Desde hoy'], ['inicio', 'Desde el inicio']], ''))}</div>
  </div>`;
}
function termsCheck(f, c) {
  const rate = Math.max(0, num(f.rate)), cut = validDay(f.cutDay);
  if (String(f.cutDay || '').trim() && !cut) return 'El día de corte debe estar entre 1 y 31';
  if (rate > 0 && !cut) return 'Indica el día de corte para aplicar el interés';
  if (c && Math.abs(curRate(c) - rate) > 1e-9 && !f.rateFrom) return 'Indica desde cuándo aplica la nueva tasa';
  return null;
}
function termsApply(c, f, isNew) {
  const rate = Math.max(0, num(f.rate));
  if (isNew || !Array.isArray(c.rateLog) || !c.rateLog.length) c.rateLog = [{ date: c.date, rate }];
  else if (Math.abs(curRate(c) - rate) > 1e-9) {
    if (f.rateFrom === 'inicio') c.rateLog = [{ date: c.date, rate }];
    else {
      const t = today(), prev = curRate(c);
      c.rateLog = c.rateLog.filter(x => x.date < t);
      if (!c.rateLog.length && c.date < t) c.rateLog.push({ date: c.date, rate: prev });
      c.rateLog.push({ date: t, rate });
    }
  }
  c.cutDay = validDay(f.cutDay);
}
function termsOnInput(f, c) {
  const box = f.querySelector('#rateFromBox'); if (!box || !c) return;
  const pay = getVal(f, 'pay'); const relevant = pay === '' || pay === 'credito';
  box.classList.toggle('hidden', !(relevant && Math.abs(curRate(c) - Math.max(0, num(f.elements.rate.value))) > 1e-9));
}
function getVal(form, n) { const r = form.querySelector(`[name="${n}"]:checked`); if (r) return r.value; const el = form.elements[n]; return el && el.value !== undefined ? el.value : ''; }
function applyShows(form) {
  form.querySelectorAll('[data-show]').forEach(el => {
    const m = el.dataset.show.match(/^(\w+)(!?=)(.*)$/); if (!m) return;
    const v = getVal(form, m[1]), list = m[3].split('|'), ok = m[2] === '=' ? list.includes(v) : !list.includes(v);
    el.classList.toggle('hidden', !ok);
  });
}

  icons(); t.classList.remove('opacity-0', '-translate-y-2');

const sheetRoot = $('#sheetRoot');

const topSheet = () => sheets[sheets.length - 1];
function openSheet(cfg) { const anim = sheetRoot.classList.contains('hidden'); sheets.push(cfg); drawSheet(anim); }
function closeSheet() { sheets.pop(); while (sheets.length && topSheet().exists && !topSheet().exists()) sheets.pop(); if (sheets.length) drawSheet(false); else hideSheet(); }
function closeAllSheets() { sheets.length = 0; hideSheet(); }
function hideSheet() { sheetRoot.classList.add('hidden'); sheetRoot.innerHTML = ''; document.documentElement.classList.remove('overflow-hidden'); }
function drawSheet(anim) {
  const cfg = topSheet();

  sheetRoot.innerHTML = `<div class="absolute inset-0 bg-black/65 ${anim ? 'fade-in' : ''}" data-act="sheetClose"></div>

sheetRoot.addEventListener('submit', async e => {

  const cfg = topSheet(); if (!cfg?.onSubmit) return;

    const r = await cfg.onSubmit(f, form); if (r === false) return;

});
function formChanged(e) { const f = $('#sheetForm'); if (!f || !f.contains(e.target)) return; applyShows(f); const cfg = topSheet(); cfg?.onInput && cfg.onInput(f, e); }

const R = {};

function computeAlerts() {
  const A = [];
  S.cards.forEach(c => { const i = cardInfo(c);
    if (i.due > 0.005 && i.dDue <= 7) A.push({ tone: i.dDue <= 3 ? 'bad' : 'warn', icon: 'calendar-clock', text: `Pago de <b>${esc(c.name)}</b> ${dayWord(i.dDue)}`, sub: `A pagar este período ${fmt(i.due)}`, act: 'cardDetail', id: c.id });
    if (i.dCut <= 3) A.push({ tone: 'warn', icon: 'scissors', text: `Corte de <b>${esc(c.name)}</b> ${dayWord(i.dCut)}`, sub: fmtD(i.cut), act: 'cardDetail', id: c.id });
  });
  S.credits.forEach(c => { const i = creditInfo(c); if (i.balance <= 0.005 || i.dNext === null) return;
    if (i.dNext <= 3) A.push({ tone: 'info', icon: 'hand-coins', text: `Corte de <b>${esc(cliName(c.clientId) || 'cliente')}</b> ${dayWord(i.dNext)}`, sub: `Saldo ${fmt(i.balance)}${i.nextInterest ? ` · Interés ${fmt(i.nextInterest)}` : ''}`, act: 'creditDetail', id: c.id });
  });
  S.debts.forEach(d => { const i = debtInfo(d); if (i.balance > 0.005 && i.dDue !== null && i.dDue <= 7) A.push({ tone: i.dDue <= 2 ? 'bad' : 'warn', icon: 'landmark', text: i.dDue < 0 ? `Deuda con <b>${esc(d.creditor)}</b> vencida` : `Pagar a <b>${esc(d.creditor)}</b> ${dayWord(i.dDue)}`, sub: `Saldo ${fmt(i.balance)}`, act: 'debtDetail', id: d.id }); });
  const low = S.products.filter(p => stock(p) <= lowStock());
  if (low.length) A.push({ tone: 'warn', icon: 'package-x', text: `<b>${low.length}</b> producto${low.length > 1 ? 's' : ''} ${lowStock() ? 'con pocas unidades' : 'sin unidades'}`, sub: low.slice(0, 3).map(p => p.name).join(', '), act: 'nav', v: 'inventario' });
  const order = { bad: 0, warn: 1, info: 2 };
  return A.sort((a, b) => order[a.tone] - order[b.tone]);
}
function statCard(label, value, sub, ic, tone, view) {
  return `<button data-act="nav" data-v="${view}" class="text-left rounded-2xl bg-zinc-900/70 border border-zinc-800/80 p-3.5 active:scale-[.98] transition min-w-0">

    <div class="${fitCls(value)} font-semibold tabular-nums tracking-tight truncate">${value}</div>
    <div class="text-[11px] text-zinc-500 mt-1 truncate">${sub}</div>
  </button>`;
}
function salesStats(r) {
  const L = S.sales.filter(s => inRange(s.date, r));
  return { list: L, total: sum(L, s => s.total), units: sum(L, s => s.qty), count: L.length, contado: sum(L.filter(s => s.pay === 'contado'), s => s.total), credito: sum(L.filter(s => s.pay === 'credito'), s => s.total) };
}

R.gastos = () => {

  const P = S.expenses.filter(e => inRange(e.date, r));
  const L = P.filter(inSeg);
  const inc = sum(L.filter(isInc), e => e.amount), out = sum(L.filter(e => !isInc(e)), e => e.amount), net = r2(inc - out);
  const segLabel = !f ? 'Todos los movimientos' : f === '__none' ? 'Sin segmento' : byId(S.segments, f).name;
  let h = periodBar('exp');

      <div class="rounded-xl border border-rose-500/20 bg-rose-500/[.06] p-3 min-w-0"><div class="text-[11px] text-rose-300/80">Gastos</div><div class="font-semibold tabular-nums text-rose-400 truncate">−${fmt(out)}</div></div>

    ${inc > 0 ? `<div class="mt-3">${progress(out / inc * 100, out > inc ? 'bg-rose-500' : 'bg-emerald-500')}<div class="text-[11px] text-zinc-500 mt-1.5">Gastado ${Math.round(out / inc * 100)}% de los ingresos</div></div>` : ''}

  h += `<div class="grid grid-cols-2 gap-2 mt-3">

  } else h += empty('tags', 'Sin segmentos creados.');
  h += secTitle(f ? `Registros · ${esc(segLabel)}` : 'Registros');
  const LL = ledger().filter(x => x.t === 'expense' && inRange(x.date, r) && inSeg(byId(S.expenses, x.id)));

  const mini = (v, l, ic) => `<button type="button" data-act="quick" data-v="${v}" class="flex items-center gap-2.5 h-12 px-3 rounded-xl border border-zinc-800 bg-zinc-950/40 text-[13px] text-zinc-300 active:bg-zinc-800">${icon(ic, 'w-4 h-4 text-zinc-500')}${l}</button>`;
  openSheet({ title: 'Registro rápido', body: () => `<div class="grid grid-cols-2 gap-3">${tile('sale', 'Venta', 'shopping-bag', 'bg-zinc-800 text-zinc-200')}${tile('pay', 'Abono', 'hand-coins', 'bg-sky-500/15 text-sky-400')}${tile('income', '+ Ingreso', 'arrow-down-left', 'bg-emerald-500/15 text-emerald-400')}${tile('expense', '− Gasto', 'receipt', 'bg-rose-500/15 text-rose-400')}</div>
    <div class="grid grid-cols-2 gap-2 mt-3 mb-2">${mini('credit', 'Crédito / préstamo', 'handshake')}${mini('debt', 'Deuda propia', 'landmark')}${mini('product', 'Producto', 'package-plus')}${mini('client', 'Cliente', 'user-plus')}</div>` });
}

function productForm(id) {
  const p = id ? byId(S.products, id) : null;
  openSheet({
    title: p ? 'Editar producto' : 'Nuevo producto', exists: () => !id || !!byId(S.products, id), focus: p ? null : 'name',
    body: () => { const sold = p ? soldQty(p.id) : 0; return `
      ${fld('Nombre / modelo', inp('name', p?.name || ''))}
      ${fld('Unidades disponibles', stepper('qty', p ? stock(p) : '', 0), sold ? `${fmtInt(sold)} unidades vendidas en total` : '')}
      ${fld('Notas (opcional)', inp('notes', p?.notes || ''))}
      ${p && stock(p) > 0 ? `<button type="button" data-act="sellProduct" data-id="${p.id}" class="w-full h-11 mb-2 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-sm font-semibold inline-flex items-center justify-center gap-2">${icon('shopping-bag', 'w-4 h-4')}Registrar venta</button>` : ''}`; },
    onSubmit(f) {
      const name = (f.name || '').trim(); if (!name) return err('Escribe el nombre o modelo');
      if (String(f.qty).trim() === '') return err('Escribe las unidades disponibles');
      const q = parseInt(f.qty); if (!(q >= 0)) return err('Cantidad inválida');
      const rec = p || { id: uid(), createdAt: Date.now() };
      Object.assign(rec, { name, notes: (f.notes || '').trim(), base: q + (p ? soldQty(p.id) : 0) });
      if (!p) S.products.push(rec);
      return p ? 'Producto actualizado' : 'Producto agregado';
    },
    onDelete: p ? async () => {
      if (!await confirmDlg('Eliminar producto', `¿Eliminar "${p.name}"? Las ventas ya registradas se conservarán en el historial.`)) return false;
      S.products = S.products.filter(x => x.id !== p.id); S.sales.forEach(s => { if (s.productId === p.id) s.productId = null; });
    } : null,
  });
}

function saleForm(id, preset = {}) {
  const s = id ? byId(S.sales, id) : null;
  const cr = s?.creditId ? byId(S.credits, s.creditId) : null;
  const avail = p => stock(p) + (s && s.productId === p.id ? s.qty : 0);
  const prods = S.products.filter(p => avail(p) > 0 || p.id === s?.productId).sort(byName);
  const pid = s ? (byId(S.products, s.productId) ? s.productId : '__free') : (preset.productId || '');
  openSheet({
    title: s ? 'Editar venta' : 'Nueva venta', submit: s ? 'Guardar cambios' : 'Registrar venta', exists: () => !id || !!byId(S.sales, id),
    body: () => `
      ${fld('Producto', sel('productId', [{ v: '', l: '—' }, ...prods.map(p => ({ v: p.id, l: `${p.name} (${avail(p)} u.)` })), { v: '__free', l: 'Venta sin inventario' }], pid), '<span id="availTxt"></span>')}
      <div data-show="productId=__free">${fld('Concepto', inp('concept', s && pid === '__free' ? s.productName : ''))}</div>
      ${fld('Cantidad de unidades', stepper('qty', s?.qty ?? '', 1))}
      ${fld('Monto total de la venta', money('total', s ? s.total : ''))}
      ${clientField(s?.clientId || preset.clientId || '')}
      ${fld('Forma de pago', seg('pay', [['contado', 'Contado'], ['credito', 'A crédito']], s?.pay || ''))}
      <div data-show="pay=contado">${fld('Cuenta destino', sel('accountId', accOpts(), s ? (s.accountId || '') : defaultAcc()))}</div>
      <div data-show="pay=credito">${termsFields(cr)}${cr ? `<div class="text-xs text-zinc-500 -mt-2 mb-4">Abonado hasta hoy: ${fmt(creditInfo(cr).paid)}</div>` : ''}</div>
      ${fld('Fecha', dateInp('date', s?.date || ''), s ? '' : 'Si la dejas vacía se registra con la fecha de hoy.')}
      ${fld('Notas (opcional)', inp('notes', s?.notes || ''))}`,
    onInput(f) {
      const E = f.elements, p = byId(S.products, E.productId.value);
      const q = parseInt(E.qty.value) || 0;
      const a = p ? avail(p) : null;
      f.querySelector('#availTxt').innerHTML = p ? `<span class="${q > a ? 'text-rose-400' : ''}">Disponibles: ${fmtInt(a)} u.${q ? ` · Quedarán ${fmtInt(Math.max(0, a - q))} u.` : ''}</span>` : '';
      termsOnInput(f, cr);
    },
    async onSubmit(f) {
      if (!f.productId) return err('Selecciona un producto o "Venta sin inventario"');
      const p = f.productId === '__free' ? null : byId(S.products, f.productId);
      if (!p && !(f.concept || '').trim()) return err('Escribe el concepto de la venta');
      const qty = parseInt(f.qty); if (!(qty >= 1)) return err('Escribe la cantidad de unidades');
      if (p && qty > avail(p)) return err(`Unidades insuficientes (disponibles: ${avail(p)})`);
      const total = r2(num(f.total)); if (total <= 0) return err('Escribe el monto de la venta');
      if (!f.pay) return err('Elige la forma de pago');
      if (f.clientId === '__new' && !(f.newClient || '').trim()) return err('Escribe el nombre del nuevo cliente');
      if (f.pay === 'credito') { if (!f.clientId) return err('Selecciona un cliente para la venta a crédito'); const t = termsCheck(f, cr); if (t) return err(t); }
      if (s && s.creditId && f.pay !== 'credito') {
        const np = paysFor('credit', s.creditId).length;
        if (np && !await confirmDlg('Cambiar a contado', `El crédito de esta venta tiene ${np} abono(s). Se eliminarán al cambiar a contado.`, 'Continuar')) return false;
      }
      const clientId = resolveClient(f);
      const rec = s || { id: uid(), createdAt: Date.now() };
      Object.assign(rec, { date: f.date || today(), productId: p ? p.id : null, productName: p ? p.name : f.concept.trim(), qty, total, clientId,

function targetOpts(kind, curId) {

  return S.cards.map(cardInfo).map(i => ({ v: i.c.id, l: `${i.c.name} — período ${fmt(i.due)}` }));
}
function targetBalance(kind, id, p) {
  let b = 0;

  else if (kind === 'debt') { const d = byId(S.debts, id); if (d) b = r2((+d.amount || 0) - sum(paysFor('debt', id), x => x.amount)); }

  return r2(b);
}

      </div>

      <div id="cPrev" class="text-xs text-zinc-400 -mt-1 mb-4"></div>

    onInput(f) { const E = f.elements, l = num(E.limit.value), u = num(E.due.value) + num(E.fresh.value) + num(E.msi.value) + num(E.other.value); f.querySelector('#cPrev').innerHTML = l > 0 ? `Límite disponible: <b class="${l - u >= 0 ? 'text-emerald-400' : 'text-rose-400'} tabular-nums">${fmt(l - u)}</b>` : ''; },

      const rec = c || { id: uid(), createdAt: Date.now() };

async function exportData() {
  S.settings.lastBackup = new Date().toISOString(); persist();
  const data = JSON.stringify(Object.assign({ app: 'gestor', exportedAt: new Date().toISOString() }, S), null, 2);
  const name = `gestor-respaldo-${today()}.json`;
  const blob = new Blob([data], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iP(hone|ad|od)/.test(navigator.userAgent)) { await navigator.share({ files: [file], title: 'Respaldo Gestor' }); renderAll(); toast('Respaldo exportado'); return; }
  } catch (e) { if (e && e.name === 'AbortError') { renderAll(); return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  renderAll(); toast('Respaldo exportado');
}
async function doImport(txt) {
  let d; try { d = JSON.parse(txt); } catch (e) { toast('El contenido no es un JSON válido', 'error'); return false; }
  if (!d || typeof d !== 'object' || !COLLS.some(k => Array.isArray(d[k]))) { toast('El archivo no parece un respaldo de Gestor', 'error'); return false; }
  if (!await confirmDlg('Importar respaldo', 'Se reemplazarán todos los datos actuales por los del respaldo. ¿Continuar?', 'Importar', false)) return false;
  delete d.app; delete d.exportedAt;
  S = normalize(d); persist(); closeAllSheets(); renderAll(); toast('Respaldo importado'); return true;
}
$('#importFile').addEventListener('change', async e => { const file = e.target.files[0]; e.target.value = ''; if (!file) return; try { doImport(await file.text()); } catch (ex) { toast('No se pudo leer el archivo', 'error'); } });

(function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#09090b'; x.fillRect(0, 0, 180, 180);
    const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#34d399'); g.addColorStop(1, '#047857');
    x.fillStyle = g; x.beginPath(); x.roundRect ? x.roundRect(30, 30, 120, 120, 30) : x.rect(30, 30, 120, 120); x.fill();
    x.fillStyle = '#09090b'; x.font = 'bold 76px -apple-system, Helvetica, Arial'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('$', 90, 94);
    const url = c.toDataURL('image/png'); $('#touchIcon').href = url; $('#favIcon').href = url;
  } catch (e) {}
})();

$('#verTag').textContent = 'v' + APP_VERSION;
const hadData = !!localStorage.getItem(LS);
const updated = hadData && S.settings.seenVersion !== APP_VERSION;
S.settings.seenVersion = APP_VERSION;

if (!['dashboard', 'tarjetas', 'inventario', 'ventas', 'clientes', 'creditos', 'gastos', 'deudas', 'movimientos', 'ajustes'].includes(UI.view)) UI.view = 'dashboard';
renderAll();
if (updated) toast(legacyRemoved ? `Actualizado a la versión ${APP_VERSION} · ${legacyRemoved} registros de ejemplo eliminados` : `Actualizado a la versión ${APP_VERSION}`);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheets.length) renderAll(); });
