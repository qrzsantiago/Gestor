<script>
'use strict';
/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = s => document.querySelector(s);
const LS = 'gestor.data.v1', LSUI = 'gestor.ui.v2', APP_VERSION = '2.11';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const r2 = n => Math.round(((+n || 0) + Number.EPSILON) * 100) / 100;
const MXN = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NUM2 = new Intl.NumberFormat('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = n => MXN.format(r2(n));
const fmtN = n => NUM2.format(r2(n));
const fmtInt = n => new Intl.NumberFormat('es-MX').format(n || 0);
const num = v => {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').trim().replace(/[$\s]/g, '');
  if (/,\d{1,2}$/.test(s) && !s.includes('.')) s = s.replace(',', '.');
  else s = s.replace(/,/g, '');
  const x = parseFloat(s); return isFinite(x) ? x : 0;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => toISO(new Date());
const pd = s => { if (!s) return null; const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const T0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtD = s => { const d = pd(s); return d ? `${d.getDate()} ${MESC[d.getMonth()]} ${d.getFullYear()}` : '—'; };
const fmtDs = s => { const d = pd(s); if (!d) return '—'; const t = T0(); return `${d.getDate()} ${MESC[d.getMonth()]}${d.getFullYear() !== t.getFullYear() ? ' ' + String(d.getFullYear()).slice(2) : ''}`; };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const dayIn = (y, m, day) => { const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12; return new Date(yy, mm, Math.min(day, dim(yy, mm))); };
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const nextOnOrAfter = (day, from = T0()) => { let d = dayIn(from.getFullYear(), from.getMonth(), day); if (d < from) d = dayIn(from.getFullYear(), from.getMonth() + 1, day); return d; };
const lastOnOrBefore = (day, from = T0()) => { let d = dayIn(from.getFullYear(), from.getMonth(), day); if (d > from) d = dayIn(from.getFullYear(), from.getMonth() - 1, day); return d; };
const firstCutAfter = (start, day) => { let d = dayIn(start.getFullYear(), start.getMonth(), day); if (d <= start) d = dayIn(start.getFullYear(), start.getMonth() + 1, day); return d; };
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const byId = (arr, id) => id ? arr.find(x => x.id === id) : undefined;
const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'es');
const validDay = v => { const n = parseInt(v); return n >= 1 && n <= 31 ? n : null; };
const pct1 = n => (Math.round(n * 100) / 100).toString();
const err = m => { toast(m, 'error'); return false; };
const dayWord = d => d < 0 ? `hace ${-d} d` : d === 0 ? 'hoy' : d === 1 ? 'mañana' : `en ${d} días`;

/* =========================================================
   DATOS (sin datos precargados)
   ========================================================= */
const COLLS = ['accounts','products','clients','sales','credits','payments','expenses','segments','cards','debts'];
function blank() {
  return { version: 2, accounts: [], products: [], clients: [], sales: [], credits: [], payments: [], expenses: [], segments: [], cards: [], debts: [], settings: { lowStock: '', defaultAccount: '', lastBackup: '', demoChecked: true } };
}
function normalize(d) {
  const b = blank();
  COLLS.forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  d.settings = Object.assign({}, b.settings, { demoChecked: false }, d.settings || {});
  // Migración desde versión anterior
  d.products.forEach(p => { delete p.cost; delete p.price; });
  d.sales.forEach(s => { delete s.unitCost; delete s.unitPrice; });
  d.credits.forEach(c => {
    if (!Array.isArray(c.rateLog) || !c.rateLog.length) c.rateLog = [{ date: c.date || today(), rate: +c.rate || 0 }];
    delete c.rate; delete c.months; delete c.dueDate;
    if (!['cuotas', 'credito', 'contado'].includes(c.mode)) c.mode = c.rateLog.some(x => +x.rate > 0) ? 'credito' : 'cuotas';
    if (c.cutDay !== null && c.cutDay !== undefined) c.cutDay = validDay(c.cutDay);
    if (!c.saleId || !d.sales.some(x => x.id === c.saleId)) {
      const sl = { id: uid(), createdAt: c.createdAt || Date.now(), date: c.date || today(), productId: null, productName: c.concept || 'Venta a crédito',
        qty: 1, total: +c.principal || 0, clientId: c.clientId || null, pay: c.mode, accountId: null, creditId: c.id };
      d.sales.push(sl); c.saleId = sl.id;
    }
  });
  d.sales.forEach(x => {
    const c = x.creditId ? d.credits.find(k => k.id === x.creditId) : null;
    if (c) { x.pay = c.mode; x.accountId = null; }
    else { x.creditId = null; x.pay = 'contado'; }
    delete x.kind;
  });
  d.credits.forEach(c => { if (c.type === 'prestamo') c.type = 'venta'; if (c.inst && !(c.inst.n >= 1 && ['semanas', 'meses'].includes(c.inst.freq))) delete c.inst; });
  d.cards.forEach(c => {
    if (c.periodBase === undefined) { c.periodBase = +c.base || 0; c.nextBase = 0; c.nextDate = ''; c.other = 0; delete c.base; }
  });
  // Categorías (v2) → Segmentos de selección múltiple (v2.2). Cada movimiento puede tener varios segmentos.
  const cats = Array.isArray(d.categories) ? d.categories : [];
  d.expenses.forEach(e => {
    if (!Array.isArray(e.segmentIds)) {
      let ids = [];
      if (e.categoryId) ids = [e.categoryId];
      else if ((e.category || '').trim()) {
        const name = e.category.trim();
        let c = cats.find(x => x.name.toLowerCase() === name.toLowerCase());
        if (!c) { c = { id: uid(), name }; cats.push(c); }
        ids = [c.id];
      }
      e.segmentIds = ids;
    }
    delete e.categoryId; delete e.category;
    if (e.type !== 'ingreso') e.type = 'gasto';
    if (e.type === 'ingreso') e.cardId = null;
  });
  cats.forEach(c => { if (!d.segments.some(x => x.id === c.id)) d.segments.push({ id: c.id, name: c.name, createdAt: c.createdAt || Date.now() }); });
  delete d.categories;
  d.version = 2;
  cleanLegacyDemo(d);
  return d;
}
/* Elimina únicamente los registros de ejemplo que creaba la versión 1 (coincidencia exacta)
   y la cuenta "Efectivo" que la v1 creaba automáticamente si nunca se usó. Se ejecuta una sola vez. */
let legacyRemoved = 0;
function cleanLegacyDemo(d) {
  if (d.settings.demoChecked) return;
  d.settings.demoChecked = true;
  let n = 0;
  const rm = (k, pred) => { const b = d[k].length; d[k] = d[k].filter(x => !pred(x)); n += b - d[k].length; };
  const DEMO_PROD = { 'iPhone 13 128GB': 4, 'AirPods Pro 2': 6, 'Funda MagSafe': 25, 'Cargador 20W': 3 };
  const DEMO_CLI = { 'Juan Pérez': '55 1234 5678', 'María López': '55 8765 4321' };
  const DEMO_EXP = [['Metro y camión', 45], ['Comida corrida', 120], ['Bolsas y empaques', 260], ['Café', 55], ['Uber', 98], ['Spotify', 129]];
  const cardIds = new Set(d.cards.filter(c => (c.name === 'Nu' && c.color === 'violet' && +c.limit === 25000 && +c.msi === 3200) || (c.name === 'Openbank' && c.color === 'rose' && +c.limit === 40000)).map(c => c.id));
  const prodIds = new Set(d.products.filter(p => DEMO_PROD[p.name] !== undefined && +p.base === DEMO_PROD[p.name]).map(p => p.id));
  const cliIds = new Set(d.clients.filter(c => DEMO_CLI[c.name] !== undefined && DEMO_CLI[c.name] === c.phone).map(c => c.id));
  const credIds = new Set(d.credits.filter(c => cliIds.has(c.clientId)).map(c => c.id));
  const saleIds = new Set(d.sales.filter(s => prodIds.has(s.productId) || d.credits.some(c => credIds.has(c.id) && c.saleId === s.id)).map(s => s.id));
  rm('payments', p => credIds.has(p.targetId) || cardIds.has(p.targetId));
  rm('credits', c => credIds.has(c.id) || saleIds.has(c.saleId));
  rm('sales', s => saleIds.has(s.id));
  rm('expenses', e => cardIds.has(e.cardId) || DEMO_EXP.some(([t, a]) => e.concept === t && +e.amount === a));
  rm('cards', c => cardIds.has(c.id));
  rm('products', p => prodIds.has(p.id));
  rm('clients', c => cliIds.has(c.id) && !d.sales.some(s => s.clientId === c.id) && !d.credits.some(x => x.clientId === c.id));
  rm('debts', x => x.creditor === 'Proveedor CDMX' && +x.amount === 6000 && x.concept === 'Mercancía a crédito');
  rm('segments', c => ['Pasajes', 'Comida', 'Insumos', 'Servicios'].includes(c.name) && !d.expenses.some(e => (e.segmentIds || []).includes(c.id)));
  const used = id => ['sales', 'payments', 'expenses', 'credits', 'debts'].some(k => d[k].some(r => r.accountId === id));
  rm('accounts', a => (a.name === 'BBVA Débito' && a.type === 'debito' && +a.base === 12000 && !used(a.id)) || (a.name === 'Efectivo' && a.type === 'efectivo' && [0, 2500].includes(+a.base || 0) && !used(a.id)));
  if (d.settings.defaultAccount && !d.accounts.some(a => a.id === d.settings.defaultAccount)) d.settings.defaultAccount = '';
  if (+d.settings.lowStock === 3) d.settings.lowStock = '';
  legacyRemoved += n;
}
function load() { try { const d = JSON.parse(localStorage.getItem(LS)); if (d && typeof d === 'object') return normalize(d); } catch (e) {} return blank(); }
let S = load();
let UI = Object.assign({ view: 'dashboard', credF: 'activos', salesTab: 'historial', cliView: 'tarjetas', movLimit: 60,
  segSel: [], dashP: 'semana', dashO: 0, salesP: 'historico', salesO: 0, expP: 'semana', expO: 0 }, (() => { try { return JSON.parse(localStorage.getItem(LSUI)) || {}; } catch (e) { return {}; } })());
UI.movLimit = 60;
function persist() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar (almacenamiento lleno)', 'error'); } }
function saveUI() { try { localStorage.setItem(LSUI, JSON.stringify(UI)); } catch (e) {} }

const accName = id => byId(S.accounts, id)?.name || '';
const cliName = id => byId(S.clients, id)?.name || '';
const isInc = e => e.type === 'ingreso';
const segNames = ids => (ids || []).map(id => byId(S.segments, id)?.name).filter(Boolean);
const signed = n => (n > 0.005 ? '+' : n < -0.005 ? '−' : '') + fmt(Math.abs(n));
const defaultAcc = () => byId(S.accounts, S.settings.defaultAccount) ? S.settings.defaultAccount : '';
const lowStock = () => Math.max(0, parseInt(S.settings.lowStock) || 0);

/* =========================================================
   CÁLCULOS DERIVADOS
   ========================================================= */
const soldQty = pid => sum(S.sales.filter(s => s.productId === pid), s => s.qty);
const stock = p => (+p.base || 0) - soldQty(p.id);
const paysFor = (kind, id) => S.payments.filter(p => p.kind === kind && p.targetId === id).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
const STATUS_TONE = { Pendiente: 'warn', Abonado: 'info', Pagado: 'ok' };
const FREQ_ADJ = { semanas: ['semanal', 'semanales'], meses: ['mensual', 'mensuales'] };
const planTxt = (n, freq, cuota) => `${n} cuota${n !== 1 ? 's' : ''} ${FREQ_ADJ[freq][n !== 1 ? 1 : 0]} de ${fmt(cuota)}`;

/* Créditos: sin plazos fijos. Interés sobre saldo insoluto en cada fecha de corte. */
const rateLogSorted = c => [...(c.rateLog || [])].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
function rateAt(c, d) { const log = rateLogSorted(c); if (!log.length) return 0; let r = +log[0].rate || 0; const iso = typeof d === 'string' ? d : toISO(d); for (const x of log) if (x.date <= iso) r = +x.rate || 0; return r; }
const curRate = c => rateAt(c, today());
function creditConcept(c) { if (c.saleId) { const s = byId(S.sales, c.saleId); if (s) return `${s.productName}${s.qty > 1 ? ' ×' + s.qty : ''}`; } return c.concept || ''; }
function creditInfo(c) {
  const P = +c.principal || 0, pays = paysFor('credit', c.id);
  const start = pd(c.date) || T0(), T = T0(), cutDay = c.mode === 'cuotas' ? null : validDay(c.cutDay);
  let interest = 0; const ev = [];
  if (cutDay) {
    let d = firstCutAfter(start, cutDay), g = 0;
    while (d <= T && g < 1200) {
      const paidB = sum(pays.filter(p => pd(p.date) <= d), p => p.amount);
      const bal = r2(P + interest - paidB), rate = rateAt(c, d) / 100;
      if (rate > 0 && bal > 0.005) { const it = r2(bal * rate); interest = r2(interest + it); ev.push({ date: toISO(d), base: bal, amt: it, rate: rate * 100 }); }
      d = dayIn(d.getFullYear(), d.getMonth() + 1, cutDay); g++;
    }
  }
  const paid = r2(sum(pays, p => p.amount)), total = r2(P + interest), balance = r2(total - paid);
  const rate = curRate(c);
  let next = null, nextInterest = 0, dNext = null;
  if (cutDay && balance > 0.005) {
    let nx = nextOnOrAfter(cutDay, addDays(T, 1)); const fc = firstCutAfter(start, cutDay); if (nx < fc) nx = fc;
    next = toISO(nx); dNext = daysBetween(T, nx); nextInterest = rate > 0 ? r2(balance * rate / 100) : 0;
  }
  // Plan de cuotas (semanas o meses): monto por cuota, cuotas cubiertas, próxima cuota y atraso
  let cuota = null, nCuotas = null, freq = null, covered = null, nextDue = null, dNextDue = null, overdueQ = false, dueCount = 0;
  if (c.mode === 'cuotas' && c.inst && c.inst.n >= 1 && (c.inst.freq === 'semanas' || c.inst.freq === 'meses')) {
    nCuotas = parseInt(c.inst.n); freq = c.inst.freq; cuota = r2(P / nCuotas);
    const dueAt = k => freq === 'semanas' ? addDays(start, 7 * k) : dayIn(start.getFullYear(), start.getMonth() + k, start.getDate());
    for (let k = 1; k <= nCuotas; k++) { if (dueAt(k) < T) dueCount = k; else break; }
    covered = Math.min(nCuotas, Math.floor((paid + 0.01) / cuota));

}

function cuotasFields(c) {

function cuotasCheck(f) {
  if (f.freq !== 'semanas' && f.freq !== 'meses') return 'Elige si las cuotas son por semanas o por meses';

function interestFields(c) {
  const on = c && c.mode === 'credito';
  return `<div class="grid grid-cols-2 gap-3 rounded-2xl border border-zinc-800 bg-zinc-950/40 px-4 pt-4 mb-4">${fld('% Interés', inp('rate', on ? (curRate(c) || '') : '', 'inputmode="decimal"'))}${fld('Día de corte', inp('cutDay', on ? (c.cutDay || '') : '', 'inputmode="numeric" pattern="[0-9]*"'))}</div>`;
}
function termsCheck(f) {
  const rate = Math.max(0, num(f.rate)), cut = validDay(f.cutDay);
  if (String(f.cutDay || '').trim() && !cut) return 'El día de corte debe estar entre 1 y 31';
  if (rate > 0 && !cut) return 'Indica el día de corte para aplicar el interés';
  return null;
}
function termsApply(c, f, isNew, mode) {
  const prevMode = c.mode; c.mode = mode;
  if (mode === 'cuotas') { c.rateLog = [{ date: c.date, rate: 0 }]; c.cutDay = null; c.inst = { freq: f.freq, n: parseInt(f.nCuotas) }; return; }
  delete c.inst;
  const rate = Math.max(0, num(f.rate));
  if (isNew || prevMode !== 'credito' || !Array.isArray(c.rateLog) || !c.rateLog.length) c.rateLog = [{ date: c.date, rate }];
  else if (Math.abs(curRate(c) - rate) > 1e-9) {
    // Un cambio de tasa aplica desde hoy; los intereses ya generados se conservan
    const t = today(), prev = curRate(c);
    c.rateLog = c.rateLog.filter(x => x.date < t);
    if (!c.rateLog.length && c.date < t) c.rateLog.push({ date: c.date, rate: prev });
    c.rateLog.push({ date: t, rate });
  }
  c.cutDay = validDay(f.cutDay);
}

function getVal(form, n) { const r = form.querySelector(`[name="${n}"]:checked`); if (r) return r.value; const el = form.elements[n]; return el && el.value !== undefined ? el.value : ''; }

function computeAlerts() {
  const A = [];
  S.cards.forEach(c => { const i = cardInfo(c);
    if (i.due > 0.005 && i.dDue <= 7) A.push({ tone: i.dDue <= 3 ? 'bad' : 'warn', icon: 'calendar-clock', text: `Pago de <b>${esc(c.name)}</b> ${dayWord(i.dDue)}`, sub: `A pagar este período ${fmt(i.due)}`, act: 'cardDetail', id: c.id });
    if (i.dCut <= 3) A.push({ tone: 'warn', icon: 'scissors', text: `Corte de <b>${esc(c.name)}</b> ${dayWord(i.dCut)}`, sub: fmtD(i.cut), act: 'cardDetail', id: c.id });
  });
  S.credits.forEach(c => { const i = creditInfo(c); if (i.balance <= 0.005) return;
    if (i.overdueQ) A.push({ tone: 'bad', icon: 'circle-alert', text: `<b>${esc(cliName(c.clientId) || 'Cliente')}</b> tiene cuotas atrasadas`, sub: `Cuota ${fmt(i.cuota)} · vencía ${fmtD(i.nextDue)}`, act: 'creditDetail', id: c.id });
    else if (i.nextDue && i.dNextDue >= 0 && i.dNextDue <= 3) A.push({ tone: 'info', icon: 'hand-coins', text: `Cuota de <b>${esc(cliName(c.clientId) || 'cliente')}</b> ${dayWord(i.dNextDue)}`, sub: `${fmt(i.cuota)} · cuota ${i.covered + 1} de ${i.nCuotas}`, act: 'creditDetail', id: c.id });
    if (i.dNext !== null && i.dNext <= 3) A.push({ tone: 'info', icon: 'hand-coins', text: `Corte de <b>${esc(cliName(c.clientId) || 'cliente')}</b> ${dayWord(i.dNext)}`, sub: `Saldo ${fmt(i.balance)}${i.nextInterest ? ` · Interés ${fmt(i.nextInterest)}` : ''}`, act: 'creditDetail', id: c.id });
  });
  S.debts.forEach(d => { const i = debtInfo(d); if (i.balance > 0.005 && i.dDue !== null && i.dDue <= 7) A.push({ tone: i.dDue <= 2 ? 'bad' : 'warn', icon: 'landmark', text: i.dDue < 0 ? `Deuda con <b>${esc(d.creditor)}</b> vencida` : `Pagar a <b>${esc(d.creditor)}</b> ${dayWord(i.dDue)}`, sub: `Saldo ${fmt(i.balance)}`, act: 'debtDetail', id: d.id }); });
  const low = S.products.filter(p => stock(p) <= lowStock());
  if (low.length) A.push({ tone: 'warn', icon: 'package-x', text: `<b>${low.length}</b> producto${low.length > 1 ? 's' : ''} ${lowStock() ? 'con pocas unidades' : 'sin unidades'}`, sub: low.slice(0, 3).map(p => p.name).join(', '), act: 'goInv' });
  const order = { bad: 0, warn: 1, info: 2 };

}

  const debtsMonth = r2(sum(dInfos.filter(i => i.d.dueDate && i.d.dueDate <= mEnd), i => i.balance)), cardsMonth = r2(sum(cInfos, i => i.due));
  return { total: r2(debtsAll + cardsAll), debtsAll, cardsAll, month: r2(debtsMonth + cardsMonth), debtsMonth, cardsMonth, monthName: MES[T.getMonth()] };

function clientMoves(id) {
  const L = [];
  S.credits.filter(c => c.clientId === id).forEach(c => {
    const sl = byId(S.sales, c.saleId), i = creditInfo(c), concept = creditConcept(c) || 'Venta';

    [...all].sort((a, b) => byName(a.c, b.c)).forEach(x => { const l = letter(x.c.name); if (l !== cur) { flush(); cur = l; buf = ''; } buf += clientCard(x); });
    flush();
    return h + `<div id="cliList" class="mt-3">${out}</div>`;
  }
  const L = mode === 'deuda' ? [...all].sort((a, b) => (b.balance - a.balance) || (b.total - a.total) || byName(a.c, b.c))

};

/* Deudas: total global = deudas propias + pago actual de tarjetas + cortes siguientes (incluye compras a meses y saldos diferidos) */
function obligations() {
  const items = [];
  S.debts.map(debtInfo).filter(i => i.balance > 0.005).forEach(i => {
    const d = i.d, pct = d.amount > 0 ? i.paid / d.amount * 100 : 0;
    items.push({ group: 'debt', act: 'debtDetail', id: d.id, title: d.creditor, amount: i.balance, icon: 'landmark', color: 'bg-amber-500', tone: 'bg-amber-500/10 text-amber-400',
      sub: [d.concept, `Pagado ${fmt(i.paid)} de ${fmt(d.amount)} (${Math.round(pct)}%)`].filter(Boolean).join(' · '),
      when: d.dueDate ? (i.overdue ? `Venció el ${fmtD(d.dueDate)}` : `Límite ${fmtD(d.dueDate)} · ${dayWord(i.dDue)}`) : 'Sin fecha límite', urgent: i.overdue || (i.dDue !== null && i.dDue <= 7),
      badges: statusBadge(i) + (i.overdue ? badge('Vencida', 'bad') : '') });
  });
  S.cards.map(cardInfo).forEach(i => {
    const c = i.c;
    if (i.due > 0.005) items.push({ group: 'due', act: 'cardDetail', id: c.id, title: `${c.name} · este período`, amount: i.due, icon: 'credit-card', color: 'bg-rose-500', tone: 'bg-rose-500/10 text-rose-400',
      sub: `Corte ${fmtD(i.curCut)}${i.curInst.length ? ` · incluye ${i.curInst.length} mensualidad${i.curInst.length !== 1 ? 'es' : ''} a meses` : ''}`,
      when: i.dDue < 0 ? `Venció el ${fmtD(i.dueDate)}` : `Pagar antes del ${fmtD(i.dueDate)} · ${dayWord(i.dDue)}`, urgent: i.dDue <= 7,
      badges: badge(i.dDue < 0 ? 'Vencido' : i.dDue <= 3 ? 'Urgente' : i.dDue <= 7 ? 'Próximo' : 'Al corriente', i.dDue < 0 || i.dDue <= 3 ? 'bad' : i.dDue <= 7 ? 'warn' : 'ok') });
    const later = r2(i.futureTotal + i.legacyDef);
    if (later > 0.005) {
      const cuts = i.schedule.filter(g => g.amount > 0.005), nx = cuts[0];
      items.push({ group: 'later', act: 'cardDetail', id: c.id, title: `${c.name} · próximos meses`, amount: later, icon: 'calendar-range', color: 'bg-violet-400', tone: 'bg-violet-500/10 text-violet-300',
        sub: [cuts.length ? `${cuts.length} corte${cuts.length !== 1 ? 's' : ''} por venir` : '', i.instPending > 0.005 ? `Compras a meses ${fmt(i.instPending)}` : '', i.legacyDef > 0.005 ? `Saldo diferido ${fmt(i.legacyDef)}` : ''].filter(Boolean).join(' · '),
        when: nx ? `Siguiente corte ${fmtD(nx.cut)}: ${fmt(nx.amount)}` : 'Saldo diferido', urgent: false, badges: badge('Diferido', 'info') });
    }
  });
  return items;
}

        <span class="text-right shrink-0"><span class="block font-semibold tabular-nums">${fmt(x.amount)}</span><span class="block text-[11px] text-zinc-500 tabular-nums">${total > 0 ? (x.amount / total * 100).toFixed(1) : 0}% del total</span></span>
      </div>
      <div class="mt-2.5 pl-12">${`<div class="h-2 rounded-full bg-zinc-800 overflow-hidden"><div class="h-full rounded-full ${x.color}" style="width:${Math.max(2, x.amount / max * 100)}%"></div></div>`}</div>

    </button>`).join(''));
  } else h += empty('circle-check', 'No tienes nada por pagar.');

  h += secTitle('Historial de pagos y deudas') + (L.length ? historyList(L) : empty('arrow-left-right', 'Sin pagos registrados.'));
  return h;
};

function autoColor() { const keys = Object.keys(CARD_COLORS), used = S.cards.map(x => x.color); return keys.find(k => !used.includes(k)) || keys[S.cards.length % keys.length]; }
function cardForm(id) {
  const c = id ? byId(S.cards, id) : null; const i = c ? cardInfo(c) : null;
  openSheet({
    title: c ? 'Editar tarjeta' : 'Nueva tarjeta de crédito', exists: () => !id || !!byId(S.cards, id), focus: c ? null : 'name',
    body: () => `
      ${fld('Nombre de la tarjeta', inp('name', c?.name || ''))}
      ${fld('Límite total', money('limit', c ? c.limit : ''))}
      ${fld('Pago del período actual', money('due', i ? i.due : ''), 'Los gastos que registres con esta tarjeta se suman solos según su fecha y el día de corte.')}
      <div class="grid grid-cols-2 gap-3">${fld('Día de corte', inp('cutDay', c?.cutDay || '', 'inputmode="numeric" pattern="[0-9]*"'))}${fld('Día límite de pago', inp('dueDay', c?.dueDay || '', 'inputmode="numeric" pattern="[0-9]*"'))}</div>`,
    onSubmit(f) {
      const name = (f.name || '').trim(); if (!name) return err('Escribe el nombre de la tarjeta');
      const cd = validDay(f.cutDay), dd = validDay(f.dueDay);
      if (!cd || !dd) return err('Los días de corte y de pago deben estar entre 1 y 31');
      const rec = c || { id: uid(), createdAt: Date.now(), color: autoColor() };
      Object.assign(rec, { name, limit: r2(num(f.limit)), cutDay: cd, dueDay: dd });
      // El monto escrito es el pago vigente hoy; los cargos ya registrados se descuentan de la base
      // Si no cambió el pago del período ni el día de corte, la base se conserva (incluido un saldo a favor)
      const unchanged = c && i && Math.abs(num(f.due) - i.due) < 0.005 && cd === i.cutDay;
      if (!unchanged) {
        const T = T0(), cc = toISO(dayIn(T.getFullYear(), T.getMonth(), cd));
        const closed = sum(cardCharges(rec, cd, cc).filter(x => !x.prior && x.cut <= cc), x => x.amount), pay = sum(paysFor('card', rec.id), p => p.amount);
        rec.periodBase = r2(num(f.due) - (closed - pay));
      }
      if (!c) S.cards.push(rec); return c ? 'Tarjeta actualizada' : 'Tarjeta agregada';
    },
    onDelete: c ? async () => {
      if (!await confirmDlg('Eliminar tarjeta', `¿Eliminar "${c.name}"? Sus pagos registrados se eliminarán y los gastos hechos con ella quedarán sin método de pago.`)) return false;
      S.cards = S.cards.filter(x => x.id !== c.id); S.payments = S.payments.filter(p => !(p.kind === 'card' && p.targetId === c.id)); S.expenses.forEach(e => { if (e.cardId === c.id) { e.cardId = null; delete e.months; } });
    } : null,
  });
}

        <div class="mt-3 divide-y divide-zinc-800/70">
          ${row(`Siguiente período · corte ${fmtDs(i.nextCut)}`, fmt(i.fresh))}
          ${row('Compras a meses por pagar', fmt(i.instPending))}
          ${i.favor > 0.005 ? row('Saldo a favor', `<span class="text-emerald-400">${fmt(i.favor)}</span>`) : ''}
          ${row('Límite total', fmt(i.limit))}
          ${row('Límite disponible', `<span class="${i.available < 0 ? 'text-rose-400' : 'text-emerald-400'}">${fmt(i.available)}</span>`)}
          ${row('Próximo corte', `${fmtD(i.cut)} <span class="${i.cutTone === 'warn' ? 'text-amber-400' : 'text-zinc-500'}">(${dayWord(i.dCut)})</span>`)}
        </div>
        ${i.legacyDef > 0.005 ? `<div class="mt-3 flex items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-950/60 px-3.5 py-2.5"><span class="text-[13px] text-zinc-400 min-w-0">Saldo diferido de la versión anterior: <b class="text-zinc-200 tabular-nums">${fmt(i.legacyDef)}</b></span><button type="button" data-act="clearLegacyDef" data-id="${c.id}" class="text-[13px] font-semibold text-rose-400 shrink-0">Quitar</button></div>` : ''}
        ${subH('Calendario de pagos')}
        ${listBox(`<div class="flex items-start justify-between gap-3 px-3.5 py-3 bg-rose-500/[.04]"><span class="min-w-0"><span class="block text-sm font-medium">Corte ${fmtD(i.curCut)}</span><span class="block text-xs text-zinc-500">Pago del período actual · límite ${fmtDs(i.dueDate)}${i.curInst.length ? ` · incluye ${i.curInst.map(x => `${esc(purchaseName(x.e))} ${x.k}/${x.n}`).join(', ')}` : ''}</span></span><span class="font-semibold tabular-nums text-rose-300 shrink-0">${fmt(i.due)}</span></div>` +
          (i.schedule.length ? i.schedule.filter(g => g.amount > 0.005 || g.items.some(x => x.n > 1)).slice(0, 18).map(g => `<div class="flex items-start justify-between gap-3 px-3.5 py-3"><span class="min-w-0"><span class="block text-sm">Corte ${fmtD(g.cut)}</span><span class="block text-xs text-zinc-500">${itemTxt(g)}</span></span><span class="font-semibold tabular-nums shrink-0">${fmt(g.amount)}</span></div>`).join('') : `<div class="px-3.5 py-3 text-sm text-zinc-500">Sin cargos para los siguientes cortes.</div>`))}
        ${subH(`Compras a meses (${i.purchases.length})`)}
        ${i.purchases.length ? listBox(i.purchases.map(x => purchaseRow(x)).join('')) : '<div class="text-sm text-zinc-500 py-2">Sin compras a meses.</div>'}
        ${subH('Movimientos con esta tarjeta')}${L.length ? listBox(L.slice(0, 40).map(ledgerRow).join('')) : '<div class="text-sm text-zinc-500 py-2">Sin movimientos registrados.</div>'}<div class="h-2"></div>`;
    },
  });
}
function accountDetail(id) {

      const a = byId(S.accounts, id); if (!a) return ''; const L = ledger().filter(x => x.acc === id && x.sign !== 0);

        <div class="grid grid-cols-2 gap-2">${kv('Entradas', fmt(inc), 'text-emerald-400')}${kv('Salidas', fmt(out), 'text-rose-400')}</div>

}
function clientDetail(id) {
  if (!id || !byId(S.clients, id)) return;
  openSheet({
    title: 'Cliente', exists: () => !!byId(S.clients, id),
    body: () => {
      const c = byId(S.clients, id); if (!c) return '';
      const x = clientSummary(c), creds = [...x.creds].sort((a, b) => b.balance - a.balance), mv = clientMoves(id);
      const firstActive = creds.find(i => i.balance > 0.005);
      return `<div class="flex items-center gap-3 pb-4">${avatar(c.name, 'w-14 h-14 text-lg')}<div class="min-w-0"><div class="text-lg font-semibold truncate">${esc(c.name)}</div>${c.phone ? `<a href="tel:${esc(c.phone.replace(/[^\d+]/g, ''))}" class="text-sm text-emerald-400 inline-flex items-center gap-1">${icon('phone', 'w-3.5 h-3.5')}${esc(c.phone)}</a>` : ''}</div></div>
        <div class="grid grid-cols-2 gap-2">${kv('Saldo actual', fmt(x.balance), x.balance > 0 ? 'text-sky-400' : '')}${kv('Deuda total', fmt(x.total))}</div>
        <div class="grid ${firstActive ? 'grid-cols-3' : 'grid-cols-2'} gap-2 mt-4">${actBtn('Venta', 'newSale', 'shopping-bag', `data-client="${id}"`, true)}${firstActive ? actBtn('Abonar', 'newPay', 'hand-coins', `data-kind="credit" data-target="${firstActive.c.id}"`) : ''}${actBtn('Editar', 'editClient', 'pencil', `data-id="${id}"`)}</div>
        ${subH(`Cuotas y créditos (${creds.length})`)}${creds.length ? listBox(creds.map(creditRow).join('')) : '<div class="text-sm text-zinc-500 py-2">Sin cuotas ni créditos.</div>'}
        ${subH(`Historial de movimientos (${mv.length})`)}${mv.length ? `<div class="rounded-2xl bg-zinc-900/70 border border-zinc-800/80 px-3.5 divide-y divide-zinc-800/60">${mv.map(moveRow).join('')}</div>` : '<div class="text-sm text-zinc-500 py-2">Sin movimientos.</div>'}<div class="h-2"></div>`;
    },
  });
}

/* =========================================================
   ACCIONES
   ========================================================= */
const A = {
  menu: () => openDrawer(), closeMenu: () => closeDrawer(),
  nav: d => { UI.view = d.v; UI.movLimit = 60; closeDrawer(); closeAllSheets(); renderAll(); window.scrollTo(0, 0); },
  fab: () => { closeDrawer(); openQuick(); },
  quick: d => { sheets.pop(); ({ sale: () => saleForm(), pay: () => payForm(), mov: () => movForm(), debt: () => debtForm() })[d.v](); },
  goInv: () => { UI.view = 'ventas'; UI.salesTab = 'inventario'; closeDrawer(); closeAllSheets(); renderAll(); window.scrollTo(0, 0); },
  goSales: () => { UI.view = 'ventas'; UI.salesTab = 'historial'; UI.salesP = UI.dashP; UI.salesO = UI.dashO; renderAll(); window.scrollTo(0, 0); },
  flipPay: (d, el) => {
    UI.payFlip = !UI.payFlip; saveUI();
    el.querySelector('.flip-inner').classList.toggle('is-flipped', UI.payFlip);
    el.setAttribute('aria-pressed', String(UI.payFlip));
    const [f, b] = el.querySelectorAll('.flip-face'); f.setAttribute('aria-hidden', String(UI.payFlip)); b.setAttribute('aria-hidden', String(!UI.payFlip));
  },
  goExp: () => { UI.view = 'gastos'; UI.expP = UI.dashP; UI.expO = UI.dashO; UI.segSel = []; renderAll(); window.scrollTo(0, 0); },
  setUI: d => { UI[d.k] = d.v; renderAll(); },
  setPeriod: d => { UI[d.k + 'P'] = d.v; UI[d.k + 'O'] = 0; renderAll(); },
  periodNav: d => { UI[d.k + 'O'] = Math.min(0, (UI[d.k + 'O'] || 0) + (+d.v)); renderAll(); },
  moreMov: () => { UI.movLimit += 100; renderAll(); },
  sheetClose: () => closeSheet(), sheetBack: () => closeSheet(), sheetCloseAll: () => closeAllSheets(),
  sheetDelete: async () => { const cfg = topSheet(); if (!cfg?.onDelete) return; const r = await cfg.onDelete(); if (r === false) return; persist(); closeSheet(); renderAll(); toast('Eliminado'); },
  step: d => { const f = $('#sheetForm'), i = f.elements[d.n], min = +(d.min ?? 1); const cur = parseInt(i.value); i.value = isNaN(cur) ? Math.max(min, d.v > 0 ? 1 : min) : Math.max(min, cur + (+d.v)); i.dispatchEvent(new Event('input', { bubbles: true })); },
  payFull: d => { const f = $('#sheetForm'); f.elements.amount.value = fmtN(+d.v); },
  newProduct: () => productForm(), editProduct: d => productForm(d.id),
  sellProduct: d => saleForm(null, { productId: d.id }),
  newSale: d => saleForm(null, { clientId: d.client }), editSale: d => saleForm(d.id),
  newClient: () => clientForm(), editClient: d => clientForm(d.id), clientDetail: d => clientDetail(d.id),
  cliExpand: d => { const st = new Set(UI.cliOpen || []); st.has(d.id) ? st.delete(d.id) : st.add(d.id); UI.cliOpen = [...st]; renderAll(); },
  editCredit: d => { const c = byId(S.credits, d.id); if (c?.saleId) saleForm(c.saleId); }, creditDetail: d => creditDetail(d.id),
  delCredit: async d => { if (await delCredit(d.id)) { persist(); closeSheet(); renderAll(); toast('Eliminado'); } },
  newPay: d => payForm(null, { kind: d.kind, targetId: d.target }), editPay: d => payForm(d.id),
  newMov: d => movForm(null, { type: d.type, segIds: d.seg ? d.seg.split(',').filter(Boolean) : [] }),
  toggleSeg: d => { const st = new Set(UI.segSel || []); st.has(d.v) ? st.delete(d.v) : st.add(d.v); UI.segSel = [...st]; renderAll(); },
  clearSeg: () => { UI.segSel = []; renderAll(); }, newExpense: d => movForm(null, { type: 'gasto', cardId: d.card, msi: d.msi === '1' }), editExpense: d => movForm(d.id),
  newSegment: () => segmentForm(), editSegment: d => segmentForm(d.id),
  addSegInline: () => {
    const f = $('#sheetForm'), i = f.elements.newSeg, n = (i.value || '').trim();
    if (!n) return toast('Escribe el nombre del segmento', 'error');
    const ex = S.segments.find(k => k.name.toLowerCase() === n.toLowerCase()), val = ex ? ex.id : 'new:' + n, box = f.querySelector('#segBox');
    const cb = [...box.querySelectorAll('input[name=seg]')].find(c => c.value === val || (c.value.startsWith('new:') && c.value.slice(4).toLowerCase() === n.toLowerCase()));
    if (cb) cb.checked = true; else box.insertAdjacentHTML('beforeend', segChip(val, ex ? ex.name : n, true));
    i.value = ''; i.focus();
  },
  purchaseDetail: d => purchaseDetail(d.id),
  fillReceived: () => { const f = $('#sheetForm'), t = num(f.elements.total.value), later = +f.querySelector('#laterPaid').dataset.v || 0; if (!(t > 0)) return toast('Escribe primero el monto de la venta', 'error'); f.elements.received.value = fmtN(Math.max(0, t - later)); f.elements.received.dispatchEvent(new Event('input', { bubbles: true })); },
  clearLegacyDef: async d => { const c = byId(S.cards, d.id); if (!c || !await confirmDlg('Quitar saldo diferido', 'Se quitará el saldo diferido que venía de la versión anterior. Puedes registrar tus compras a meses con el botón "Compra a meses".', 'Quitar')) return; c.msi = 0; c.other = 0; persist(); drawSheet(false); renderAll(); toast('Saldo diferido quitado'); },
  newCard: () => cardForm(), editCard: d => cardForm(d.id), cardDetail: d => cardDetail(d.id),
  newAccount: () => accountForm(), editAccount: d => accountForm(d.id), accountDetail: d => accountDetail(d.id),
  newDebt: () => debtForm(), editDebt: d => debtForm(d.id), debtDetail: d => debtDetail(d.id),
  editRec: d => ({ sale: () => saleForm(d.id), expense: () => movForm(d.id), payment: () => payForm(d.id), credit: () => creditDetail(d.id), debt: () => debtDetail(d.id) })[d.t]?.(),
  export: () => exportData(),
  import: () => $('#importFile').click(),
  copyJson: async () => { try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Datos copiados al portapapeles'); } catch (e) { toast('No se pudo copiar', 'error'); } },
  pasteJson: () => openSheet({ title: 'Importar desde texto', submit: 'Importar', body: () => `${fld('Contenido del respaldo JSON', `<textarea name="json" rows="8" class="w-full p-3 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 font-mono text-xs focus:outline-none focus:border-emerald-500/60"></textarea>`)}`, onSubmit: async f => (await doImport(f.json || '')) ? 'Respaldo importado' : false }),
  wipe: async () => {
    if (!await confirmDlg('Borrar todos los datos', 'Se eliminarán permanentemente todos los registros. Te recomendamos exportar un respaldo antes.', 'Continuar')) return;
    if (!await confirmDlg('¿Estás seguro?', 'Esta acción no se puede deshacer.', 'Borrar todo')) return;
    S = blank(); persist(); renderAll(); toast('Datos eliminados');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.disabled) return;
  e.preventDefault(); fn(el.dataset, el, e);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset?.act === 'flipPay') { e.preventDefault(); A.flipPay(e.target.dataset, e.target); } });
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.filter) return;
  const q = t.value.trim().toLowerCase(), box = document.getElementById(t.dataset.filter); if (!box) return;
  box.querySelectorAll('[data-q]').forEach(el => el.classList.toggle('hidden', !!q && !el.dataset.q.includes(q)));
  box.querySelectorAll('[data-group]').forEach(g => g.classList.toggle('hidden', !g.querySelector('[data-q]:not(.hidden)')));
});
$('#app').addEventListener('change', e => {
  const t = e.target, k = t.dataset?.setting; if (!k) return;
  S.settings[k] = k === 'lowStock' ? (t.value.trim() === '' ? '' : Math.max(0, parseInt(t.value) || 0)) : t.value;
  persist(); renderAll(); toast('Preferencia guardada');
});

/* =========================================================
   RESPALDO
   ========================================================= */
async function exportData() {
  S.settings.lastBackup = new Date().toISOString(); persist();
  const data = JSON.stringify(Object.assign({ app: 'gestor', exportedAt: new Date().toISOString() }, S), null, 2);
  const name = `gestor-respaldo-${today()}.json`;
  const blob = new Blob([data], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iP(hone|ad|od)/.test(navigator.userAgent)) { await navigator.share({ files: [file], title: 'Respaldo Gestor' }); renderAll(); toast('Respaldo exportado'); return; }
  } catch (e) { if (e && e.name === 'AbortError') { renderAll(); return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  renderAll(); toast('Respaldo exportado');
}
async function doImport(txt) {
  let d; try { d = JSON.parse(txt); } catch (e) { toast('El contenido no es un JSON válido', 'error'); return false; }
  if (!d || typeof d !== 'object' || !COLLS.some(k => Array.isArray(d[k]))) { toast('El archivo no parece un respaldo de Gestor', 'error'); return false; }
  if (!await confirmDlg('Importar respaldo', 'Se reemplazarán todos los datos actuales por los del respaldo. ¿Continuar?', 'Importar', false)) return false;
  delete d.app; delete d.exportedAt;
  S = normalize(d); persist(); closeAllSheets(); renderAll(); toast('Respaldo importado'); return true;
}
$('#importFile').addEventListener('change', async e => { const file = e.target.files[0]; e.target.value = ''; if (!file) return; try { doImport(await file.text()); } catch (ex) { toast('No se pudo leer el archivo', 'error'); } });

/* =========================================================
   ICONO DE LA APP (apple-touch-icon generado)
   ========================================================= */
(function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#09090b'; x.fillRect(0, 0, 180, 180);
    const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#34d399'); g.addColorStop(1, '#047857');
    x.fillStyle = g; x.beginPath(); x.roundRect ? x.roundRect(30, 30, 120, 120, 30) : x.rect(30, 30, 120, 120); x.fill();
    x.fillStyle = '#09090b'; x.font = 'bold 76px -apple-system, Helvetica, Arial'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('$', 90, 94);
    const url = c.toDataURL('image/png'); $('#touchIcon').href = url; $('#favIcon').href = url;
  } catch (e) {}
})();

/* =========================================================
   INICIO
   ========================================================= */
$('#verTag').textContent = 'v' + APP_VERSION;
const hadData = !!localStorage.getItem(LS);
const updated = hadData && S.settings.seenVersion !== APP_VERSION;
S.settings.seenVersion = APP_VERSION;
if (hadData) persist();
if (UI.view === 'inventario') { UI.view = 'ventas'; UI.salesTab = 'inventario'; } else if (UI.view === 'creditos') { UI.view = 'ventas'; UI.salesTab = 'cobrar'; }
if (!ALL_VIEWS.some(x => x[0] === UI.view)) UI.view = 'dashboard';
renderAll();
if (updated) toast(legacyRemoved ? `Actualizado a la versión ${APP_VERSION} · ${legacyRemoved} registros de ejemplo eliminados` : `Actualizado a la versión ${APP_VERSION}`);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheets.length) renderAll(); });
</script>
