<input type="file" id="importFile" accept="application/json,.json,text/plain" class="hidden">

<script>
'use strict';
/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = s => document.querySelector(s);
const LS = 'gestor.data.v1', LSUI = 'gestor.ui.v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const r2 = n => Math.round(((+n || 0) + Number.EPSILON) * 100) / 100;
const MXN = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NUM2 = new Intl.NumberFormat('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = n => MXN.format(r2(n));
const fmtN = n => NUM2.format(r2(n));
const fmtInt = n => new Intl.NumberFormat('es-MX').format(n || 0);
const num = v => {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').trim().replace(/[$\s]/g, '');
  if (/,\d{1,2}$/.test(s) && !s.includes('.')) s = s.replace(',', '.');
  else s = s.replace(/,/g, '');
  const x = parseFloat(s); return isFinite(x) ? x : 0;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => toISO(new Date());
const pd = s => { if (!s) return null; const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const T0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtD = s => { const d = pd(s); return d ? `${d.getDate()} ${MESC[d.getMonth()]} ${d.getFullYear()}` : '—'; };
const fmtDs = s => { const d = pd(s); if (!d) return '—'; const t = T0(); return `${d.getDate()} ${MESC[d.getMonth()]}${d.getFullYear() !== t.getFullYear() ? ' ' + String(d.getFullYear()).slice(2) : ''}`; };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const dayIn = (y, m, day) => { const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12; return new Date(yy, mm, Math.min(day, dim(yy, mm))); };
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const nextOnOrAfter = (day, from = T0()) => { let d = dayIn(from.getFullYear(), from.getMonth(), day); if (d < from) d = dayIn(from.getFullYear(), from.getMonth() + 1, day); return d; };
const firstCutAfter = (start, day) => { let d = dayIn(start.getFullYear(), start.getMonth(), day); if (d <= start) d = dayIn(start.getFullYear(), start.getMonth() + 1, day); return d; };
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const byId = (arr, id) => id ? arr.find(x => x.id === id) : undefined;
const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'es');
const clampDay = v => Math.min(31, Math.max(1, parseInt(v) || 1));
const pct1 = n => (Math.round(n * 100) / 100).toString();
const err = m => { toast(m, 'error'); return false; };
const dayWord = d => d < 0 ? `hace ${-d} d` : d === 0 ? 'hoy' : d === 1 ? 'mañana' : `en ${d} días`;

/* =========================================================
   DATOS
   ========================================================= */
const COLLS = ['accounts','products','clients','sales','credits','payments','expenses','cards','debts'];
function blank() {
  return { version: 1, accounts: [{ id: uid(), name: 'Efectivo', type: 'efectivo', base: 0 }], products: [], clients: [], sales: [], credits: [], payments: [], expenses: [], cards: [], debts: [], settings: { lowStock: 3, defaultAccount: '', lastBackup: '' } };
}
function normalize(d) {
  const b = blank();
  COLLS.forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  if (!d.accounts.length) d.accounts = b.accounts;
  d.settings = Object.assign({}, b.settings, d.settings || {});
  d.version = 1;
  return d;
}
function load() { try { const d = JSON.parse(localStorage.getItem(LS)); if (d && typeof d === 'object') return normalize(d); } catch (e) {} return blank(); }
let S = load();
let UI = Object.assign({ view: 'dashboard', invTab: 'productos', cliTab: 'creditos', credF: 'activos', movF: 'todos', movLimit: 60,
  dashP: 'semana', dashO: 0, salesP: 'mes', salesO: 0, expP: 'semana', expO: 0 }, (() => { try { return JSON.parse(localStorage.getItem(LSUI)) || {}; } catch (e) { return {}; } })());
UI.movLimit = 60;
function persist() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar (almacenamiento lleno)', 'error'); } }
function saveUI() { try { localStorage.setItem(LSUI, JSON.stringify(UI)); } catch (e) {} }

const accName = id => byId(S.accounts, id)?.name || '';
const cliName = id => byId(S.clients, id)?.name || '';
const defaultAcc = () => (byId(S.accounts, S.settings.defaultAccount) || S.accounts[0])?.id || '';

/* =========================================================
   CÁLCULOS DERIVADOS
   ========================================================= */
const soldQty = pid => sum(S.sales.filter(s => s.productId === pid), s => s.qty);
const stock = p => (+p.base || 0) - soldQty(p.id);
const paysFor = (kind, id) => S.payments.filter(p => p.kind === kind && p.targetId === id).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
const MODE = { unico: 'Pago único', plazos: 'A plazos', msi: 'MSI' };
const STATUS_TONE = { Pendiente: 'warn', Abonado: 'info', Pagado: 'ok' };

function creditInfo(c) {
  const P = +c.principal || 0, pays = paysFor('credit', c.id);
  const rate = c.mode === 'msi' ? 0 : (+c.rate || 0) / 100;
  const start = pd(c.date) || T0(), T = T0();
  const cutDay = clampDay(c.cutDay || start.getDate());
  let interest = 0, cuts = 0, g = 0; const ev = [];
  let d = firstCutAfter(start, cutDay);
  while (d <= T && g < 1200) {
    const paidB = sum(pays.filter(p => pd(p.date) <= d), p => p.amount);
    const bal = r2(P + interest - paidB);
    if (d < T) cuts++;
    if (rate > 0 && bal > 0.005) { const it = r2(bal * rate); interest = r2(interest + it); ev.push({ date: toISO(d), base: bal, amt: it }); }
    d = dayIn(d.getFullYear(), d.getMonth() + 1, cutDay); g++;
  }
  const paid = r2(sum(pays, p => p.amount)), total = r2(P + interest), balance = r2(total - paid);
  const n = Math.max(1, parseInt(c.months) || 1);
  let monthly = null;
  if (c.mode === 'msi') monthly = r2(P / n);
  else if (c.mode === 'plazos') monthly = rate > 0 ? r2(P * rate / (1 - Math.pow(1 + rate, -n))) : r2(P / n);
  let overdue = false, next = null, covered = null;
  if (balance > 0.005) {
    if (c.mode === 'unico') { next = c.dueDate || null; overdue = !!c.dueDate && pd(c.dueDate) < T; }
    else {
      let nx = nextOnOrAfter(cutDay, T); const fc = firstCutAfter(start, cutDay); if (nx < fc) nx = fc;
      next = toISO(nx);
      const expected = Math.min(total, Math.min(cuts, n) * monthly); overdue = paid + 0.01 < expected;
    }
  }
  if (monthly) covered = Math.min(n, Math.floor((paid + 0.01) / monthly));
  const status = balance <= 0.005 ? 'Pagado' : paid > 0 ? 'Abonado' : 'Pendiente';
  return { c, P, interest, total, paid, balance: Math.max(0, balance), rawBalance: balance, status, overdue, next, monthly, n, covered, ev, pays, rate: rate * 100, cutDay };
}
function debtInfo(d) {
  const pays = paysFor('debt', d.id); const paid = r2(sum(pays, p => p.amount));
  const balance = r2((+d.amount || 0) - paid);
  const status = balance <= 0.005 ? 'Pagado' : paid > 0 ? 'Abonado' : 'Pendiente';
  const dd = d.dueDate ? daysBetween(T0(), pd(d.dueDate)) : null;
  return { d, pays, paid, balance: Math.max(0, balance), status, dDue: dd, overdue: balance > 0.005 && dd !== null && dd < 0 };
}
function cardInfo(c) {
  const exp = sum(S.expenses.filter(e => e.cardId === c.id), e => e.amount);
  const pay = sum(paysFor('card', c.id), p => p.amount);
  const used = r2((+c.base || 0) + exp - pay), msi = r2(+c.msi || 0), limit = r2(+c.limit || 0);
  const owed = r2(used + msi), available = r2(limit - owed);
  const pct = limit > 0 ? Math.max(0, Math.min(100, owed / limit * 100)) : 0;
  const T = T0(), cut = nextOnOrAfter(clampDay(c.cutDay), T), due = nextOnOrAfter(clampDay(c.dueDay), T);
  const dCut = daysBetween(T, cut), dDue = daysBetween(T, due);
  const cutTone = dCut <= 3 ? 'warn' : 'ok';
  const dueTone = owed <= 0.005 ? 'ok' : dDue <= 3 ? 'bad' : dDue <= 7 ? 'warn' : 'ok';
  return { c, exp, pay, used, msi, limit, owed, available, pct, cut: toISO(cut), due: toISO(due), dCut, dDue, cutTone, dueTone };
}
function accFlows(a) {
  const id = a.id; let f = 0;
  f += sum(S.sales.filter(s => s.pay === 'contado' && s.accountId === id), s => s.total);
  f += sum(S.payments.filter(p => p.kind === 'credit' && p.accountId === id), p => p.amount);
  f -= sum(S.payments.filter(p => p.kind !== 'credit' && p.accountId === id), p => p.amount);
  f -= sum(S.expenses.filter(e => !e.cardId && e.accountId === id), e => e.amount);
  f -= sum(S.credits.filter(c => c.type === 'prestamo' && c.accountId === id), c => c.principal);
  f += sum(S.debts.filter(d => d.accountId === id), d => d.amount);
  return r2(f);
}
const accBal = a => r2((+a.base || 0) + accFlows(a));

function range(p, off) {
  const t = T0(); let s, e, label;
  if (p === 'historico') return { start: null, end: null, label: 'Todo el historial', days: null };
  if (p === 'semana') {
    const dow = (t.getDay() + 6) % 7; s = new Date(t); s.setDate(t.getDate() - dow + off * 7); e = new Date(s); e.setDate(s.getDate() + 6);
    label = `${s.getDate()} ${MESC[s.getMonth()]} – ${e.getDate()} ${MESC[e.getMonth()]} ${e.getFullYear()}`;
  } else if (p === 'quincena') {
    const idx = t.getFullYear() * 24 + t.getMonth() * 2 + (t.getDate() > 15 ? 1 : 0) + off;
    const y = Math.floor(idx / 24), m = Math.floor((idx % 24) / 2), h = idx % 2;
    s = new Date(y, m, h ? 16 : 1); e = h ? new Date(y, m + 1, 0) : new Date(y, m, 15);
    label = `${s.getDate()}–${e.getDate()} ${MES[m]} ${y}`;
  } else {
    s = new Date(t.getFullYear(), t.getMonth() + off, 1); e = new Date(s.getFullYear(), s.getMonth() + 1, 0);
    label = `${MES[s.getMonth()][0].toUpperCase() + MES[s.getMonth()].slice(1)} ${s.getFullYear()}`;
  }
  const endEff = e > t ? t : e;
  return { start: toISO(s), end: toISO(e), label, days: Math.max(1, daysBetween(s, endEff) + 1) };
}
const inRange = (d, r) => !r.start || (d >= r.start && d <= r.end);

function ledger() {
  const L = [];
  S.sales.forEach(s => L.push({ t: 'sale', id: s.id, date: s.date, cr: s.createdAt || 0, title: `Venta · ${s.productName || 'Sin concepto'}${s.qty > 1 ? ' ×' + s.qty : ''}`,
    sub: [cliName(s.clientId), s.pay === 'credito' ? 'A crédito' : accName(s.accountId)].filter(Boolean).join(' · ') || 'Contado',
    amount: s.total, sign: s.pay === 'credito' || !s.accountId ? 0 : 1, acc: s.accountId, client: s.clientId, icon: 'shopping-bag', tone: 'bg-emerald-500/10 text-emerald-400', type: 'ventas' }));
  S.expenses.forEach(e => { const card = byId(S.cards, e.cardId);
    L.push({ t: 'expense', id: e.id, date: e.date, cr: e.createdAt || 0, title: e.concept || e.category || 'Gasto', sub: [e.category, card ? card.name : accName(e.accountId)].filter(Boolean).join(' · '),
      amount: e.amount, sign: -1, acc: e.cardId ? null : e.accountId, card: e.cardId, icon: 'receipt', tone: 'bg-rose-500/10 text-rose-400', type: 'gastos' }); });
  S.payments.forEach(p => {
    let title = 'Abono', sub = '', icon = 'hand-coins', tone = 'bg-sky-500/10 text-sky-400', sign = 1, client = null;
    if (p.kind === 'credit') { const c = byId(S.credits, p.targetId); client = c?.clientId; title = `Abono · ${cliName(c?.clientId) || 'Cliente'}`; sub = c?.concept || (c?.type === 'prestamo' ? 'Préstamo' : 'Crédito'); sign = p.accountId ? 1 : 0; }
    else if (p.kind === 'debt') { const d = byId(S.debts, p.targetId); title = `Pago deuda · ${d?.creditor || ''}`; sub = d?.concept || 'Deuda propia'; icon = 'landmark'; tone = 'bg-amber-500/10 text-amber-400'; sign = p.accountId ? -1 : 0; }
    else { const c = byId(S.cards, p.targetId); title = `Pago tarjeta · ${c?.name || ''}`; sub = 'Pago a tarjeta'; icon = 'credit-card'; tone = 'bg-violet-500/10 text-violet-300'; sign = p.accountId ? -1 : 0; }
    sub = [sub, accName(p.accountId)].filter(Boolean).join(' · ');
    L.push({ t: 'payment', id: p.id, date: p.date, cr: p.createdAt || 0, title, sub, amount: p.amount, sign, acc: p.accountId, card: p.kind === 'card' ? p.targetId : null, client, icon, tone, type: 'abonos' });
  });
  S.credits.filter(c => c.type === 'prestamo').forEach(c => L.push({ t: 'credit', id: c.id, date: c.date, cr: c.createdAt || 0, title: `Préstamo a ${cliName(c.clientId) || 'cliente'}`,
    sub: [c.concept, accName(c.accountId)].filter(Boolean).join(' · ') || 'Préstamo de dinero', amount: c.principal, sign: c.accountId ? -1 : 0, acc: c.accountId, client: c.clientId, icon: 'handshake', tone: 'bg-sky-500/10 text-sky-400', type: 'prestamos' }));
  S.debts.forEach(d => L.push({ t: 'debt', id: d.id, date: d.date, cr: d.createdAt || 0, title: `Deuda con ${d.creditor || 'acreedor'}`, sub: [d.concept, accName(d.accountId)].filter(Boolean).join(' · ') || 'Préstamo recibido',
    amount: d.amount, sign: d.accountId ? 1 : 0, acc: d.accountId, icon: 'landmark', tone: 'bg-amber-500/10 text-amber-400', type: 'prestamos' }));
  return L.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.cr - a.cr));
}

/* =========================================================
   COMPONENTES UI
   ========================================================= */
const icon = (n, c = 'w-5 h-5') => `<i data-lucide="${n}" class="${c}"></i>`;
const TONES = { ok: 'bg-emerald-500/10 text-emerald-400 ring-emerald-500/20', warn: 'bg-amber-500/10 text-amber-400 ring-amber-500/20', bad: 'bg-rose-500/10 text-rose-400 ring-rose-500/25', info: 'bg-sky-500/10 text-sky-400 ring-sky-500/20', mute: 'bg-zinc-800/80 text-zinc-400 ring-zinc-700/60' };
const DOT = { ok: 'bg-emerald-400', warn: 'bg-amber-400', bad: 'bg-rose-500 animate-pulse' };
const badge = (t, tone = 'mute') => `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-medium ring-1 ring-inset whitespace-nowrap ${TONES[tone]}">${t}</span>`;
const statusBadge = i => badge(i.status, STATUS_TONE[i.status]);
const box = (inner, cls = '') => `<div class="rounded-2xl bg-zinc-900/70 border border-zinc-800/80 ${cls}">${inner}</div>`;
const listBox = (rows, id = '') => `<div ${id ? `id="${id}"` : ''} class="rounded-2xl bg-zinc-900/70 border border-zinc-800/80 divide-y divide-zinc-800/70 overflow-hidden">${rows}</div>`;

  sheetRoot.classList.remove('hidden');
  document.documentElement.classList.add('overflow-hidden');
  const hasFooter = cfg.onSubmit || cfg.onDelete;
  sheetRoot.innerHTML = `<div class="absolute inset-0 bg-black/65 ${anim ? 'fade-in' : ''}" data-act="sheetClose"></div>
  <div class="absolute inset-x-0 bottom-0 mx-auto max-w-2xl ${anim ? 'slide-up' : ''}">
    <div class="flex flex-col bg-zinc-900 border border-zinc-800 border-b-0 rounded-t-[28px] shadow-2xl shadow-black" style="max-height:calc(100dvh - env(safe-area-inset-top) - 12px)">
      <div class="pt-2.5 pb-1 grid place-items-center"><div class="w-10 h-1.5 rounded-full bg-zinc-700"></div></div>
      <div class="flex items-center gap-2 px-4 pb-3 pt-1">
        ${sheets.length > 1 ? `<button type="button" data-act="sheetBack" aria-label="Atrás" class="w-9 h-9 grid place-items-center rounded-full bg-zinc-800 text-zinc-300">${icon('chevron-left')}</button>` : ''}
        <h3 class="flex-1 text-[17px] font-semibold truncate px-1">${esc(cfg.title)}</h3>
        <button type="button" data-act="sheetCloseAll" aria-label="Cerrar" class="w-9 h-9 grid place-items-center rounded-full bg-zinc-800 text-zinc-300">${icon('x')}</button>
      </div>
      <form id="sheetForm" novalidate autocomplete="off" class="flex-1 overflow-y-auto overscroll-contain px-5 pt-1 pb-2">${cfg.body()}<button type="submit" class="hidden" tabindex="-1"></button></form>
      ${hasFooter ? `<div class="px-5 pt-3 border-t border-zinc-800/80 flex gap-3" style="padding-bottom:calc(env(safe-area-inset-bottom) + 14px)">
        ${cfg.onDelete ? `<button type="button" data-act="sheetDelete" aria-label="Eliminar" class="h-12 w-12 shrink-0 grid place-items-center rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/20">${icon('trash-2')}</button>` : ''}
        ${cfg.onSubmit ? `<button type="submit" form="sheetForm" class="flex-1 h-12 rounded-xl bg-emerald-500 text-zinc-950 font-semibold active:bg-emerald-400">${esc(cfg.submit || 'Guardar')}</button>` : ''}
      </div>` : `<div style="height:calc(env(safe-area-inset-bottom) + 14px)"></div>`}
    </div>
  </div>`;
  const form = $('#sheetForm');
  applyShows(form); cfg.onInput && cfg.onInput(form, { target: {} }); icons();
  if (cfg.focus) { const el = form.elements[cfg.focus]; if (el) try { el.focus({ preventScroll: true }); } catch (e) {} }
}
sheetRoot.addEventListener('submit', async e => {
  e.preventDefault();
  const cfg = topSheet(); if (!cfg?.onSubmit) return;
  const form = $('#sheetForm'); const f = Object.fromEntries(new FormData(form));
  try {
    const r = await cfg.onSubmit(f, form); if (r === false) return;
    persist(); closeSheet(); renderAll(); toast(typeof r === 'string' ? r : 'Guardado');
  } catch (ex) { console.error(ex); toast('Error: ' + ex.message, 'error'); }
});
function formChanged(e) { const f = $('#sheetForm'); if (!f || !f.contains(e.target)) return; applyShows(f); const cfg = topSheet(); cfg?.onInput && cfg.onInput(f, e); }
const isPick = t => t.tagName === 'SELECT' || t.type === 'radio' || t.type === 'date' || t.type === 'checkbox';
sheetRoot.addEventListener('input', e => { if (!isPick(e.target)) formChanged(e); });
sheetRoot.addEventListener('change', e => { if (isPick(e.target)) formChanged(e); });
sheetRoot.addEventListener('focusin', e => { const t = e.target; if (t.hasAttribute && t.hasAttribute('data-money') && t.value) t.value = String(num(t.value)); });
sheetRoot.addEventListener('focusout', e => { const t = e.target; if (t.hasAttribute && t.hasAttribute('data-money') && t.value.trim() !== '') t.value = fmtN(num(t.value)); });

const R = {};

function computeAlerts() {
  const A = [];
  S.cards.forEach(c => { const i = cardInfo(c);
    if (i.owed > 0.005 && i.dDue <= 7) A.push({ tone: i.dDue <= 3 ? 'bad' : 'warn', icon: 'calendar-clock', text: `Pago de <b>${esc(c.name)}</b> ${dayWord(i.dDue)}`, sub: `Utilizado ${fmt(i.used)}`, act: 'cardDetail', id: c.id });
    if (i.dCut <= 3) A.push({ tone: 'warn', icon: 'scissors', text: `Corte de <b>${esc(c.name)}</b> ${dayWord(i.dCut)}`, sub: fmtD(i.cut), act: 'cardDetail', id: c.id });
  });
  S.credits.forEach(c => { const i = creditInfo(c); if (i.balance <= 0.005) return;
    if (i.overdue) A.push({ tone: 'bad', icon: 'circle-alert', text: `<b>${esc(cliName(c.clientId) || 'Cliente')}</b> tiene pagos atrasados`, sub: `Saldo ${fmt(i.balance)}`, act: 'creditDetail', id: c.id });
    else if (i.next) { const d = daysBetween(T0(), pd(i.next)); if (d >= 0 && d <= 3) A.push({ tone: 'info', icon: 'hand-coins', text: `Cobro a <b>${esc(cliName(c.clientId))}</b> ${dayWord(d)}`, sub: i.monthly ? `Mensualidad ${fmt(i.monthly)}` : `Saldo ${fmt(i.balance)}`, act: 'creditDetail', id: c.id }); }
  });
  S.debts.forEach(d => { const i = debtInfo(d); if (i.balance > 0.005 && i.dDue !== null && i.dDue <= 7) A.push({ tone: i.dDue <= 2 ? 'bad' : 'warn', icon: 'landmark', text: i.dDue < 0 ? `Deuda con <b>${esc(d.creditor)}</b> vencida` : `Pagar a <b>${esc(d.creditor)}</b> ${dayWord(i.dDue)}`, sub: `Saldo ${fmt(i.balance)}`, act: 'debtDetail', id: d.id }); });
  const low = S.products.filter(p => stock(p) <= (+S.settings.lowStock || 0));
  if (low.length) A.push({ tone: 'warn', icon: 'package-x', text: `<b>${low.length}</b> producto${low.length > 1 ? 's' : ''} con stock bajo o agotado`, sub: low.slice(0, 3).map(p => p.name).join(', '), act: 'nav', v: 'inventario' });
  const order = { bad: 0, warn: 1, info: 2 };
  return A.sort((a, b) => order[a.tone] - order[b.tone]);
}
function statCard(label, value, sub, ic, tone, view) {
  return `<button data-act="nav" data-v="${view}" class="text-left rounded-2xl bg-zinc-900/70 border border-zinc-800/80 p-3.5 active:scale-[.98] transition min-w-0">
    <div class="flex items-center justify-between mb-3 gap-2"><span class="text-[12px] font-medium text-zinc-400 truncate">${label}</span><span class="w-8 h-8 shrink-0 rounded-lg grid place-items-center ${tone}">${icon(ic, 'w-4 h-4')}</span></div>
    <div class="${fitCls(value)} font-semibold tabular-nums tracking-tight truncate">${value}</div>
    <div class="text-[11px] text-zinc-500 mt-1 truncate">${sub}</div>
  </button>`;
}
function salesStats(r) {
  const L = S.sales.filter(s => inRange(s.date, r));
  return { list: L, total: sum(L, s => s.total), units: sum(L, s => s.qty), profit: sum(L, s => s.total - (+s.unitCost || 0) * s.qty), count: L.length, contado: sum(L.filter(s => s.pay === 'contado'), s => s.total), credito: sum(L.filter(s => s.pay === 'credito'), s => s.total) };
}

R.dashboard = () => {

  h += `<div class="grid grid-cols-2 gap-3">
    ${statCard('Balance total', fmt(bal), `${S.accounts.length} cuenta${S.accounts.length !== 1 ? 's' : ''}`, 'wallet', 'bg-emerald-500/10 text-emerald-400', 'tarjetas')}
    ${statCard('Por cobrar', fmt(porCobrar), `${creds.length} crédito${creds.length !== 1 ? 's' : ''} activo${creds.length !== 1 ? 's' : ''}`, 'hand-coins', 'bg-sky-500/10 text-sky-400', 'clientes')}

    const BG = { bad: 'border-rose-500/25 bg-rose-500/[.07]', warn: 'border-amber-500/20 bg-amber-500/[.06]', info: 'border-sky-500/20 bg-sky-500/[.06]' };

  }
  // Tarjetas y cuentas
  h += secTitle('Tarjetas de crédito y cuentas', link('Administrar', 'nav', 'data-v="tarjetas"'));
  h += `<div class="flex gap-3 overflow-x-auto no-scrollbar snap-x snap-mandatory -mx-4 px-4 pb-1">${S.cards.map(c => cardVisual(c)).join('')}
    <button data-act="newCard" class="w-[150px] shrink-0 snap-start rounded-2xl border border-dashed border-zinc-700 grid place-items-center text-zinc-500 min-h-[176px] active:bg-zinc-900"><span class="text-center">${icon('plus', 'w-6 h-6 mx-auto')}<span class="block text-[13px] mt-1">Agregar tarjeta</span></span></button></div>`;
  h += `<div class="mt-3">${listBox(S.accounts.map(accRow).join('') + `<button data-act="newAccount" class="w-full flex items-center gap-3 px-3.5 py-3 text-left text-zinc-400 active:bg-zinc-800/60"><span class="w-10 h-10 rounded-xl grid place-items-center border border-dashed border-zinc-700">${icon('plus', 'w-4 h-4')}</span><span class="text-sm">Agregar cuenta</span></button>`)}</div>`;
  // Ventas
  const r = range(UI.dashP, UI.dashO), st = salesStats(r);
  h += secTitle('Ventas del período', link('Ver ventas', 'goSales'));
  h += periodBar('dash', false);
  h += `<div class="grid grid-cols-2 gap-3 mt-3">${kv('Vendido', fmt(st.total))}${kv('Utilidad', fmt(st.profit), st.profit >= 0 ? 'text-emerald-400' : 'text-rose-400')}${kv('Unidades', fmtInt(st.units))}${kv('Ventas', `${st.count} <span class="text-[11px] font-normal text-zinc-500">· crédito ${fmt(st.credito)}</span>`)}</div>`;

R.gastos = () => {
  const r = range(UI.expP, UI.expO);
  const L = S.expenses.filter(e => inRange(e.date, r));
  const total = sum(L, e => e.amount);
  let h = periodBar('exp');
  h += `<div class="mt-3 rounded-2xl bg-zinc-900/70 border border-zinc-800/80 p-4">
    <div class="text-[12px] text-zinc-400">Total de gastos · ${esc(r.label)}</div>

  if (L.length) {

R.tarjetas = () => {
  const infos = S.cards.map(cardInfo);
  let h = `<div class="grid grid-cols-3 gap-2">${kv('Límite total', fmt(sum(infos, i => i.limit)), 'text-[13px]')}${kv('Deuda TDC', fmt(sum(infos, i => i.owed)), 'text-[13px] text-rose-400')}${kv('Disponible', fmt(sum(infos, i => i.available)), 'text-[13px] text-emerald-400')}</div>`;
  h += secTitle('Tarjetas de crédito', btn('Tarjeta', 'newCard', 'plus', '', 'ghost'));
  h += S.cards.length ? `<div class="space-y-3">${S.cards.map(c => `<div data-act="cardDetail" data-id="${c.id}" class="active:scale-[.99] transition">${cardVisual(c, true)}</div>`).join('')}</div>` : empty('credit-card', 'Registra tus tarjetas (Nu, Openbank, BBVA…) para controlar límites, MSI y fechas de corte y pago.');
  h += secTitle('Cuentas y efectivo', btn('Cuenta', 'newAccount', 'plus', '', 'ghost'));
  h += listBox(S.accounts.map(accRow).join(''));
  h += `<div class="mt-2 px-1 text-xs text-zinc-500">Balance total: <b class="text-zinc-300 tabular-nums">${fmt(sum(S.accounts, accBal))}</b></div>`;

R.deudas = () => {
  const infos = S.debts.map(debtInfo), cards = S.cards.map(cardInfo);
  const dOwed = sum(infos, i => i.balance), cOwed = sum(cards, i => Math.max(0, i.owed));
  let h = `<div class="rounded-2xl bg-zinc-900/70 border border-zinc-800/80 p-4">
    <div class="text-[12px] text-zinc-400">Total por pagar</div><div class="text-[30px] font-semibold tabular-nums tracking-tight text-rose-400">${fmt(dOwed + cOwed)}</div>
    <div class="grid grid-cols-2 gap-3 mt-3">${kv('Deudas propias', fmt(dOwed))}<button data-act="nav" data-v="tarjetas" class="text-left">${kv('Tarjetas de crédito', fmt(cOwed))}</button></div></div>`;
  h += `<div class="flex items-center justify-between mt-6 mb-3"><h2 class="text-[12px] font-semibold uppercase tracking-[.08em] text-zinc-500">Mis deudas</h2><div class="flex gap-2">${btn('Pagar', 'newPay', 'hand-coins', 'data-kind="debt"', 'ghost')}${btn('Nueva', 'newDebt')}</div></div>`;
  const act = infos.filter(i => i.balance > 0.005).sort((a, b) => (a.dDue ?? 9e9) - (b.dDue ?? 9e9)), paid = infos.filter(i => i.balance <= 0.005);
  h += act.length ? listBox(act.map(debtRow).join('')) : empty('landmark', 'No tienes deudas pendientes registradas.');
  if (paid.length) h += secTitle('Liquidadas') + listBox(paid.map(debtRow).join(''));
  return h;
};

function openQuick() {
  const tile = (v, l, ic, cls) => `<button type="button" data-act="quick" data-v="${v}" class="rounded-2xl p-4 border border-zinc-800 bg-zinc-950/60 active:scale-[.97] transition text-center"><span class="w-12 h-12 mx-auto rounded-2xl grid place-items-center ${cls}">${icon(ic, 'w-6 h-6')}</span><span class="block mt-2 font-semibold text-sm">${l}</span></button>`;
  const mini = (v, l, ic) => `<button type="button" data-act="quick" data-v="${v}" class="flex items-center gap-2.5 h-12 px-3 rounded-xl border border-zinc-800 bg-zinc-950/40 text-[13px] text-zinc-300 active:bg-zinc-800">${icon(ic, 'w-4 h-4 text-zinc-500')}${l}</button>`;
  openSheet({ title: 'Registro rápido', body: () => `<div class="grid grid-cols-3 gap-3">${tile('sale', 'Venta', 'shopping-bag', 'bg-emerald-500/15 text-emerald-400')}${tile('expense', 'Gasto', 'receipt', 'bg-rose-500/15 text-rose-400')}${tile('pay', 'Abono', 'hand-coins', 'bg-sky-500/15 text-sky-400')}</div>
    <div class="grid grid-cols-2 gap-2 mt-3 mb-2">${mini('credit', 'Préstamo / crédito', 'handshake')}${mini('debt', 'Deuda propia', 'landmark')}${mini('product', 'Producto', 'package-plus')}${mini('client', 'Cliente', 'user-plus')}</div>` });
}

function productForm(id, preset = {}) {
  const p = id ? byId(S.products, id) : null;
  openSheet({
    title: p ? 'Editar producto' : 'Nuevo producto', exists: () => !id || !!byId(S.products, id), focus: p ? null : 'name',
    body: () => { const sold = p ? soldQty(p.id) : 0; return `
      ${fld('Nombre / modelo', inp('name', p?.name || '', 'placeholder="Ej. iPhone 13 128GB Azul" autocomplete="off"'))}
      ${fld('Unidades en stock', stepper('qty', p ? stock(p) : 1, 0), sold ? `${fmtInt(sold)} unidades vendidas en total` : '')}
      <div class="grid grid-cols-2 gap-3">${fld('Precio de costo', money('cost', p?.cost ?? ''))}${fld('Precio de venta', money('price', p?.price ?? ''))}</div>
      <div id="mPrev" class="text-xs text-zinc-400 -mt-1 mb-4"></div>
      ${fld('Notas (opcional)', inp('notes', p?.notes || '', 'placeholder="SKU, color, proveedor…"'))}
      ${p ? `<button type="button" data-act="sellProduct" data-id="${p.id}" class="w-full h-11 mb-2 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-sm font-semibold inline-flex items-center justify-center gap-2">${icon('shopping-bag', 'w-4 h-4')}Registrar venta de este producto</button>` : ''}`; },
    onInput(f) { const c = num(f.elements.cost.value), pr = num(f.elements.price.value); f.querySelector('#mPrev').innerHTML = pr > 0 ? `Ganancia por unidad: <b class="${pr - c >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${fmt(pr - c)}</b> · Margen ${((pr - c) / pr * 100).toFixed(1)}%` : ''; },
    onSubmit(f) {
      const name = (f.name || '').trim(); if (!name) return err('Escribe el nombre o modelo');
      const q = parseInt(f.qty); if (!(q >= 0)) return err('Cantidad inválida');
      const rec = p || { id: uid(), createdAt: Date.now() };
      Object.assign(rec, { name, cost: r2(num(f.cost)), price: r2(num(f.price)), notes: (f.notes || '').trim(), base: q + (p ? soldQty(p.id) : 0) });
      if (!p) S.products.push(rec);
      return p ? 'Producto actualizado' : 'Producto agregado';
    },
    onDelete: p ? async () => {
      if (!await confirmDlg('Eliminar producto', `¿Eliminar "${p.name}"? Las ventas ya registradas se conservarán en el historial.`)) return false;
      S.products = S.products.filter(x => x.id !== p.id); S.sales.forEach(s => { if (s.productId === p.id) s.productId = null; });
    } : null,
  });
}

function saleForm(id, preset = {}) {
  const s = id ? byId(S.sales, id) : null;
  const cr = s?.creditId ? byId(S.credits, s.creditId) : null;
  const avail = p => stock(p) + (s && s.productId === p.id ? s.qty : 0);
  const prods = S.products.filter(p => avail(p) > 0 || p.id === s?.productId).sort(byName);
  const pid = s ? (byId(S.products, s.productId) ? s.productId : '') : (preset.productId || prods[0]?.id || '');
  const p0 = byId(S.products, pid);
  const qty = s?.qty || 1, unit = s ? s.unitPrice : (p0 ? p0.price : ''), total = s ? s.total : (p0 ? r2(p0.price * qty) : '');
  const terms = cr || { mode: 'plazos', months: 3, rate: '', cutDay: new Date().getDate() };
  openSheet({
    title: s ? 'Editar venta' : 'Nueva venta', submit: s ? 'Guardar cambios' : 'Registrar venta', exists: () => !id || !!byId(S.sales, id),
    body: () => `
      ${fld('Producto', sel('productId', [...prods.map(p => ({ v: p.id, l: `${p.name} — ${avail(p)} disp.` })), { v: '', l: 'Venta libre (sin inventario)' }], pid), '<span id="availTxt"></span>')}
      <div data-show="productId=">${fld('Concepto', inp('concept', s && !byId(S.products, s.productId) ? s.productName : '', 'placeholder="Ej. Servicio, reparación, accesorio…"'))}</div>
      ${fld('Cantidad de unidades', stepper('qty', qty, 1))}
      <div class="grid grid-cols-2 gap-3">${fld('Precio unitario', money('unitPrice', unit))}${fld('Monto total', money('total', total))}</div>
      ${clientField(s?.clientId || preset.clientId || '')}
      ${fld('Forma de pago', seg('pay', [['contado', 'Contado'], ['credito', 'A crédito']], s?.pay || preset.pay || 'contado'))}
      <div data-show="pay=contado">${fld('Cuenta destino', sel('accountId', accOpts(), s ? (s.accountId ?? defaultAcc()) : defaultAcc()))}</div>
      <div data-show="pay=credito">${termsFields(terms)}${cr ? `<div class="text-xs text-zinc-500 -mt-2 mb-4">Abonado hasta hoy: ${fmt(creditInfo(cr).paid)}</div>` : ''}</div>
      ${fld('Fecha', dateInp('date', s?.date || today()))}
      ${fld('Notas (opcional)', inp('notes', s?.notes || ''))}`,
    onInput(f, e) {
      const E = f.elements, n = e.target.name, p = byId(S.products, E.productId.value);
      const q = Math.max(1, parseInt(E.qty.value) || 1);
      if (n === 'productId' && p) E.unitPrice.value = fmtN(p.price);
      if (n === 'total') E.unitPrice.value = fmtN(num(E.total.value) / q);
      else if (n === 'productId' || n === 'qty' || n === 'unitPrice') E.total.value = fmtN(num(E.unitPrice.value) * q);
      const a = p ? avail(p) : null;
      f.querySelector('#availTxt').innerHTML = p ? `<span class="${q > a ? 'text-rose-400' : ''}">Disponible: ${fmtInt(a)} u. · Quedarán ${fmtInt(Math.max(0, a - q))} u.</span>${p.cost ? ` · Utilidad ${fmt(num(E.total.value) - p.cost * q)}` : ''}` : '';
      termsPreview(f, num(E.total.value));
    },
    async onSubmit(f) {
      const qty = Math.max(1, parseInt(f.qty) || 0);
      const p = byId(S.products, f.productId);
      if (p && qty > avail(p)) return err(`Stock insuficiente (disponible: ${avail(p)})`);
      if (!p && !(f.concept || '').trim()) return err('Escribe un concepto para la venta libre');
      const total = r2(num(f.total)); if (total <= 0) return err('El monto debe ser mayor a cero');
      if (f.clientId === '__new' && !(f.newClient || '').trim()) return err('Escribe el nombre del nuevo cliente');
      if (f.pay === 'credito' && !f.clientId) return err('Selecciona un cliente para la venta a crédito');
      if (s && s.creditId && f.pay !== 'credito') {
        const np = paysFor('credit', s.creditId).length;
        if (np && !await confirmDlg('Cambiar a contado', `El crédito de esta venta tiene ${np} abono(s). Se eliminarán al cambiar a contado.`, 'Continuar')) return false;
      }
      const clientId = resolveClient(f);
      const rec = s || { id: uid(), createdAt: Date.now() };
      Object.assign(rec, { date: f.date || today(), productId: p ? p.id : null, productName: p ? p.name : f.concept.trim(), qty, unitPrice: r2(total / qty), total,
        unitCost: p ? (s && s.productId === p.id && s.unitCost != null ? s.unitCost : (+p.cost || 0)) : 0, clientId, pay: f.pay === 'credito' ? 'credito' : 'contado',
        accountId: f.pay === 'credito' ? null : (f.accountId || null), notes: (f.notes || '').trim() });
      if (rec.pay === 'credito') {
        let c = byId(S.credits, rec.creditId);
        if (!c) { c = { id: uid(), createdAt: Date.now(), type: 'venta', saleId: rec.id, accountId: null }; S.credits.push(c); rec.creditId = c.id; }
        Object.assign(c, termsFrom(f), { clientId, principal: total, date: rec.date, concept: `${rec.productName}${qty > 1 ? ' ×' + qty : ''}` });
      } else if (rec.creditId) { removeCreditData(rec.creditId); rec.creditId = null; }
      if (!s) S.sales.push(rec);
      return s ? 'Venta actualizada' : `Venta registrada · ${fmt(total)}`;
    },
    onDelete: s ? async () => {
      const np = s.creditId ? paysFor('credit', s.creditId).length : 0;
      if (!await confirmDlg('Eliminar venta', `Se eliminará la venta${byId(S.products, s.productId) ? ` y se devolverán ${s.qty} u. al stock` : ''}${s.creditId ? `, junto con su crédito${np ? ` y ${np} abono(s)` : ''}` : ''}.`)) return false;
      S.sales = S.sales.filter(x => x.id !== s.id); if (s.creditId) removeCreditData(s.creditId);
    } : null,
  });
}
function removeCreditData(id) { S.credits = S.credits.filter(c => c.id !== id); S.payments = S.payments.filter(p => !(p.kind === 'credit' && p.targetId === id)); }

function creditForm(id, preset = {}) {
  const c = id ? byId(S.credits, id) : null;
  if (c?.saleId) return saleForm(c.saleId);
  const v = c || { type: 'prestamo', clientId: preset.clientId || '', principal: '', date: today(), accountId: defaultAcc(), mode: 'unico', months: 3, rate: '', cutDay: new Date().getDate(), dueDate: '', concept: '', notes: '' };
  openSheet({
    title: c ? 'Editar préstamo / crédito' : 'Nuevo préstamo / crédito', exists: () => !id || !!byId(S.credits, id),
    body: () => `
      ${clientField(v.clientId, true)}
      ${fld('Tipo', seg('type', [['prestamo', 'Préstamo de dinero'], ['venta', 'Venta a crédito']], v.type))}
      ${fld('Monto', money('principal', v.principal))}
      ${fld('Concepto', inp('concept', v.concept || '', 'placeholder="Ej. Préstamo personal, mercancía…"'))}
      <div data-show="type=prestamo">${fld('Sale de la cuenta', sel('accountId', accOpts(), v.accountId ?? ''))}</div>
      ${fld('Fecha de inicio', dateInp('date', v.date))}
      ${termsFields(v)}
      ${fld('Notas (opcional)', inp('notes', v.notes || ''))}`,
    onInput(f) { termsPreview(f, num(f.elements.principal.value)); },
    onSubmit(f) {
      if (!f.clientId) return err('Selecciona un cliente');
      if (f.clientId === '__new' && !(f.newClient || '').trim()) return err('Escribe el nombre del nuevo cliente');
      const P = r2(num(f.principal)); if (P <= 0) return err('El monto debe ser mayor a cero');
      const clientId = resolveClient(f);
      const rec = c || { id: uid(), createdAt: Date.now() };
      Object.assign(rec, termsFrom(f), { clientId, type: f.type === 'venta' ? 'venta' : 'prestamo', principal: P, date: f.date || today(), concept: (f.concept || '').trim(), notes: (f.notes || '').trim(), accountId: f.type === 'prestamo' ? (f.accountId || null) : null });
      if (!c) S.credits.push(rec);
      return c ? 'Crédito actualizado' : 'Crédito registrado';
    },
    onDelete: c ? () => delCredit(c.id) : null,
  });
}
async function delCredit(id) {
  const c = byId(S.credits, id); const np = paysFor('credit', id).length;
  const msg = c.saleId ? `Se eliminará el crédito, ${np} abono(s) y la venta asociada (el stock se restaurará).` : `Se eliminará este registro y ${np} abono(s) asociados.`;
  if (!await confirmDlg('Eliminar crédito', msg)) return false;
  if (c.saleId) S.sales = S.sales.filter(s => s.id !== c.saleId);
  removeCreditData(id); return true;
}

function targetOpts(kind, curId) {
  if (kind === 'credit') return S.credits.map(creditInfo).filter(i => i.balance > 0.005 || i.c.id === curId).map(i => ({ v: i.c.id, l: `${cliName(i.c.clientId) || 'Cliente'} · ${i.c.concept || (i.c.type === 'prestamo' ? 'Préstamo' : 'Crédito')} — ${fmt(i.balance)}` }));
  if (kind === 'debt') return S.debts.map(debtInfo).filter(i => i.balance > 0.005 || i.d.id === curId).map(i => ({ v: i.d.id, l: `${i.d.creditor} — ${fmt(i.balance)}` }));
  return S.cards.map(cardInfo).map(i => ({ v: i.c.id, l: `${i.c.name} — utilizado ${fmt(i.used)}` }));
}
function targetBalance(kind, id, p) {
  let b = 0;
  if (kind === 'credit') { const c = byId(S.credits, id); if (c) b = creditInfo(c).rawBalance; }
  else if (kind === 'debt') { const d = byId(S.debts, id); if (d) b = r2((+d.amount || 0) - sum(paysFor('debt', id), x => x.amount)); }
  else { const c = byId(S.cards, id); if (c) b = cardInfo(c).used; }
  if (p && p.kind === kind && p.targetId === id) b += +p.amount || 0;
  return r2(b);
}
function payForm(id, preset = {}) {
  const p = id ? byId(S.payments, id) : null;
  let kind = p?.kind || preset.kind;
  if (!kind) kind = S.credits.some(c => creditInfo(c).balance > 0.005) ? 'credit' : S.cards.length ? 'card' : S.debts.length ? 'debt' : 'credit';
  const tId = p?.targetId || preset.targetId || '';
  const tsel = k => { const o = targetOpts(k, p?.targetId); return o.length ? sel('t_' + k, [{ v: '', l: 'Selecciona…' }, ...o], k === kind ? tId : (o.length === 1 ? o[0].v : '')) : `<div class="h-12 px-3.5 rounded-xl border border-dashed border-zinc-800 text-sm text-zinc-500 flex items-center">No hay saldos pendientes</div><input type="hidden" name="t_${k}" value="">`; };
  openSheet({
    title: p ? 'Editar abono' : 'Registrar abono', submit: p ? 'Guardar cambios' : 'Registrar abono', exists: () => !id || !!byId(S.payments, id), focus: (tId && !p) ? 'amount' : null,
    body: () => `
      ${fld('Aplicar a', seg('kind', [['credit', 'Cobro cliente'], ['debt', 'Deuda propia'], ['card', 'Tarjeta']], kind))}
      <div data-show="kind=credit">${fld('Crédito / préstamo', tsel('credit'))}</div>
      <div data-show="kind=debt">${fld('Deuda', tsel('debt'))}</div>
      <div data-show="kind=card">${fld('Tarjeta', tsel('card'))}</div>
      <div id="payInfo" class="hidden -mt-1 mb-4 flex items-center justify-between gap-3 rounded-xl bg-zinc-950/60 border border-zinc-800 px-3.5 py-2.5"></div>
      ${fld('Monto del abono', money('amount', p?.amount ?? ''))}
      ${fld('<span id="accLbl">Cuenta</span>', sel('accountId', accOpts(), p ? (p.accountId ?? '') : defaultAcc()))}
      ${fld('Fecha', dateInp('date', p?.date || today()))}
      ${fld('Notas (opcional)', inp('notes', p?.notes || ''))}`,
    onInput(f) {
      const k = getVal(f, 'kind'), t = f.elements['t_' + k]?.value, info = f.querySelector('#payInfo');
      f.querySelector('#accLbl').textContent = k === 'credit' ? 'Cuenta destino (entra el dinero)' : 'Cuenta de origen (sale el dinero)';
      if (!t) { info.classList.add('hidden'); return; }
      const b = targetBalance(k, t, p);
      info.classList.remove('hidden');
      info.innerHTML = `<span class="text-[13px] text-zinc-400">${k === 'card' ? 'Saldo utilizado' : 'Saldo pendiente'}${p ? ' (antes de este abono)' : ''}: <b class="text-zinc-100 tabular-nums">${fmt(b)}</b></span><button type="button" data-act="payFull" data-v="${b}" class="text-[13px] font-semibold text-emerald-400 shrink-0">Liquidar</button>`;
    },
    onSubmit(f) {
      const k = ['credit', 'debt', 'card'].includes(f.kind) ? f.kind : 'credit', t = f['t_' + k];
      if (!t) return err('Selecciona a qué se aplica el abono');
      const amount = r2(num(f.amount)); if (amount <= 0) return err('El monto debe ser mayor a cero');
      if (k !== 'card') { const b = targetBalance(k, t, p); if (amount > b + 0.01) return err(`El abono excede el saldo pendiente (${fmt(b)})`); }
      const rec = p || { id: uid(), createdAt: Date.now() };
      Object.assign(rec, { kind: k, targetId: t, amount, date: f.date || today(), accountId: f.accountId || null, notes: (f.notes || '').trim() });
      if (!p) S.payments.push(rec);
      let msg = p ? 'Abono actualizado' : `Abono registrado · ${fmt(amount)}`;
      if (k === 'credit') { const c = byId(S.credits, t); if (c && creditInfo(c).balance <= 0.005) msg = '¡Crédito liquidado! Estado: Pagado'; }
      if (k === 'debt') { const d = byId(S.debts, t); if (d && debtInfo(d).balance <= 0.005) msg = '¡Deuda liquidada!'; }
      return msg;
    },
    onDelete: p ? async () => { if (!await confirmDlg('Eliminar abono', `Se eliminará el abono de ${fmt(p.amount)} y se recalculará el saldo.`)) return false; S.payments = S.payments.filter(x => x.id !== p.id); } : null,
  });
}

      const a = byId(S.accounts, id); if (!a) return ''; const L = ledger().filter(x => x.acc === id && x.sign !== 0);

      return `<div class="text-center pt-1 pb-4"><div class="text-sm text-zinc-400">${esc(a.name)} · ${ACC_TYPE[a.type] || ''}</div><div class="text-[36px] font-semibold tabular-nums tracking-tight mt-1 ${accBal(a) < 0 ? 'text-rose-400' : ''}">${fmt(accBal(a))}</div><div class="text-xs text-zinc-500">Saldo actual</div></div>
        <div class="grid grid-cols-2 gap-2">${kv('Entradas', fmt(inc), 'text-emerald-400')}${kv('Salidas', fmt(out), 'text-rose-400')}</div>
        <div class="grid grid-cols-1 gap-2 mt-4">${actBtn('Editar / ajustar saldo', 'editAccount', 'pencil', `data-id="${a.id}"`)}</div>
        ${subH('Movimientos')}${L.length ? listBox(L.slice(0, 60).map(ledgerRow).join('')) : '<div class="text-sm text-zinc-500 py-2">Sin movimientos.</div>'}<div class="h-2"></div>`;
    },
  });
}
function clientDetail(id) {
  if (!id || !byId(S.clients, id)) return;
  openSheet({
    title: 'Cliente', exists: () => !!byId(S.clients, id),
    body: () => {
      const c = byId(S.clients, id); if (!c) return '';
      const creds = S.credits.filter(x => x.clientId === id).map(creditInfo).sort((a, b) => b.balance - a.balance);
      const sales = ledger().filter(x => x.t === 'sale' && x.client === id);
      const owed = sum(creds, i => i.balance), bought = sum(S.sales.filter(s => s.clientId === id), s => s.total);
      return `<div class="flex items-center gap-3 pb-4"><span class="w-14 h-14 shrink-0 rounded-full grid place-items-center bg-zinc-800 text-lg font-semibold">${esc(initials(c.name))}</span><div class="min-w-0"><div class="text-lg font-semibold truncate">${esc(c.name)}</div>${c.phone ? `<a href="tel:${esc(c.phone.replace(/[^\d+]/g, ''))}" class="text-sm text-emerald-400 inline-flex items-center gap-1">${icon('phone', 'w-3.5 h-3.5')}${esc(c.phone)}</a>` : '<div class="text-sm text-zinc-500">Sin teléfono</div>'}${c.notes ? `<div class="text-xs text-zinc-500 mt-0.5">${esc(c.notes)}</div>` : ''}</div></div>
        <div class="grid grid-cols-2 gap-2">${kv('Por cobrar', fmt(owed), owed > 0 ? 'text-sky-400' : '')}${kv('Compras totales', fmt(bought))}</div>
        <div class="grid grid-cols-2 gap-2 mt-4">${actBtn('Venta', 'newSale', 'shopping-bag', `data-client="${id}"`, true)}${actBtn('Préstamo', 'newCredit', 'handshake', `data-client="${id}"`)}${owed > 0.005 ? actBtn('Abonar', 'newPay', 'hand-coins', `data-kind="credit" data-target="${creds.find(i => i.balance > 0.005)?.c.id || ''}"`) : ''}${actBtn('Editar', 'editClient', 'pencil', `data-id="${id}"`)}</div>
        ${subH(`Créditos y préstamos (${creds.length})`)}${creds.length ? listBox(creds.map(creditRow).join('')) : '<div class="text-sm text-zinc-500 py-2">Sin créditos.</div>'}
        ${subH(`Compras (${sales.length})`)}${sales.length ? listBox(sales.slice(0, 30).map(ledgerRow).join('')) : '<div class="text-sm text-zinc-500 py-2">Sin compras registradas.</div>'}<div class="h-2"></div>`;
    },
  });
}

  newExpense: d => expForm(null, { cardId: d.card }), editExpense: d => expForm(d.id),

  pasteJson: () => openSheet({ title: 'Importar desde texto', submit: 'Importar', body: () => `${fld('Pega aquí el contenido del respaldo JSON', `<textarea name="json" rows="8" class="w-full p-3 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 font-mono text-xs focus:outline-none focus:border-emerald-500/60"></textarea>`)}`, onSubmit: async f => (await doImport(f.json || '')) ? 'Respaldo importado' : false }),
  wipe: async () => {
    if (!await confirmDlg('Borrar todos los datos', 'Se eliminarán permanentemente todos los productos, ventas, clientes, créditos, gastos, tarjetas y cuentas. Te recomendamos exportar un respaldo antes.', 'Continuar')) return;
    if (!await confirmDlg('¿Estás seguro?', 'Esta acción no se puede deshacer.', 'Borrar todo')) return;

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.disabled) return;
  e.preventDefault(); fn(el.dataset, el, e);
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.filter) return;
  const q = t.value.trim().toLowerCase(), box = document.getElementById(t.dataset.filter); if (!box) return;
  box.querySelectorAll('[data-q]').forEach(el => el.classList.toggle('hidden', !!q && !el.dataset.q.includes(q)));
  box.querySelectorAll('[data-group]').forEach(g => g.classList.toggle('hidden', !g.querySelector('[data-q]:not(.hidden)')));
});
$('#app').addEventListener('change', e => {
  const t = e.target, k = t.dataset?.setting; if (!k) return;

});

/* =========================================================
   RESPALDO
   ========================================================= */
async function exportData() {
  S.settings.lastBackup = new Date().toISOString(); persist();
  const data = JSON.stringify(Object.assign({ app: 'gestor', exportedAt: new Date().toISOString() }, S), null, 2);
  const name = `gestor-respaldo-${today()}.json`;
  const blob = new Blob([data], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iP(hone|ad|od)/.test(navigator.userAgent)) { await navigator.share({ files: [file], title: 'Respaldo Gestor' }); renderAll(); toast('Respaldo exportado'); return; }
  } catch (e) { if (e && e.name === 'AbortError') { renderAll(); return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  renderAll(); toast('Respaldo exportado');
}
async function doImport(txt) {
  let d; try { d = JSON.parse(txt); } catch (e) { toast('El contenido no es un JSON válido', 'error'); return false; }
  if (!d || typeof d !== 'object' || !COLLS.some(k => Array.isArray(d[k]))) { toast('El archivo no parece un respaldo de Gestor', 'error'); return false; }
  if (!await confirmDlg('Importar respaldo', 'Se reemplazarán todos los datos actuales por los del respaldo. ¿Continuar?', 'Importar', false)) return false;
  delete d.app; delete d.exportedAt;
  S = normalize(d); persist(); closeAllSheets(); renderAll(); toast('Respaldo importado'); return true;
}
$('#importFile').addEventListener('change', async e => { const file = e.target.files[0]; e.target.value = ''; if (!file) return; try { doImport(await file.text()); } catch (ex) { toast('No se pudo leer el archivo', 'error'); } });
